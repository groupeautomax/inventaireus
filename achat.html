<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Fiche d'achat — Groupe Automax</title>
<script>
/* Ancienne adresse de la fiche d'achat (site v1, retiré le 2 octobre 2026).
   On renvoie vers la nouvelle interface en gardant le NIV : achat.html?vin=X → index.html#/achat?vin=X */
(function () {
  var q = new URLSearchParams(location.search);
  var vin = (q.get('vin') || '').trim();
  location.replace('index.html#/achat' + (vin ? '?vin=' + encodeURIComponent(vin) : ''));
})();
</script>
<meta http-equiv="refresh" content="0; url=index.html#/achat">
</head>
<body style="font: 14px -apple-system, sans-serif; padding: 24px;">Redirection vers la nouvelle interface… <a href="index.html#/achat">Continuer</a></body>
</html>
