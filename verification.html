<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vérification d'inventaire</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Les polices etaient chargees par @import dans le CSS : le navigateur
       doit alors telecharger la page, puis le CSS, puis decouvrir l import,
       puis aller chercher la feuille des polices, puis les polices. En
       <link> dans l entete, les deux dernieres etapes partent tout de suite. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>

  :root{
    --paper: #F4F6F9;
    --paper-card: #FFFFFF;
    --ink: #1E2A3A;
    --ink-soft: #6B7684;
    --line: #E4E7EC;
    --accent: #2563EB;
    --accent-bg: #EFF6FF;
    --stamp-red: #DC2626;
    --stamp-red-bg: #FEF2F2;
    --stamp-amber: #D97706;
    --stamp-amber-bg: #FFFBEB;
    --stamp-teal: #059669;
    --stamp-teal-bg: #ECFDF5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Inter',sans-serif;color:var(--ink);font-size:13px;}
  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px 40px;}

  .manifest-head{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 1px 2px rgba(16,24,40,0.04);
    padding:14px 16px;
    margin-bottom:14px;
  }
  .manifest-head::before{
    content:"VÉRIFICATION";
    display:block;
    font-size:10px;
    letter-spacing:1.5px;
    color:var(--accent);
    font-weight:600;
    margin-bottom:2px;
  }
  .manifest-title{
    font-weight:600;
    font-size:18px;
    letter-spacing:-0.2px;
    margin:2px 0 1px;
  }
  .manifest-sub{font-size:12px;color:var(--ink-soft);margin:0;}

  .group-section{margin-bottom:28px;}
  .group-title{
    font-weight:600;font-size:15px;letter-spacing:-0.1px;
    margin:0 0 2px;color:var(--ink);
  }
  .group-sub{font-size:11.5px;color:var(--ink-soft);margin:0 0 10px;}

  .sources{display:grid;gap:10px;margin-bottom:12px;}
  .source-card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:8px;padding:11px;
    display:flex;flex-direction:column;gap:7px;
  }
  .source-label{font-size:11px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;color:var(--ink-soft);}
  .file-input-wrap{
    border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center;cursor:pointer;
    font-size:11.5px;color:var(--ink-soft);transition:border-color .15s;
  }
  .file-input-wrap:hover{border-color:var(--accent);}
  .file-input-wrap.loaded{border-color:var(--stamp-teal);border-style:solid;background:var(--stamp-teal-bg);color:var(--stamp-teal);font-weight:500;}
  .file-input-wrap input{display:none;}
  .col-select-row{display:flex;flex-direction:column;gap:3px;}
  .col-select-row label{font-size:10.5px;color:var(--ink-soft);}
  select{
    font-family:'Inter',sans-serif;font-size:12px;padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);
  }
  select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}
  .count-line{font-size:11px;color:var(--ink-soft);}
  .count-line b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}

  .compare-bar{text-align:center;margin-bottom:14px;}
  .compare-btn{
    font-family:'Inter',sans-serif;font-weight:500;font-size:12.5px;border-radius:6px;
    background:var(--accent);color:#fff;border:none;padding:9px 24px;cursor:pointer;
  }
  .compare-btn:hover{background:#1D4ED8;}
  .compare-btn:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}

  .stats{display:grid;gap:8px;margin-bottom:12px;}
  .stat{background:var(--paper-card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;}
  .stat .num{font-size:19px;font-weight:600;}
  .stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-soft);margin-top:1px;}
  .stat.alert .num{color:var(--stamp-red);}
  .stat.ok .num{color:var(--stamp-teal);}

  .toolbar{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap;align-items:center;}
  .search-input{flex:1;min-width:160px;font-family:'Inter',sans-serif;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}
  .filter-btn{
    font-family:'Inter',sans-serif;font-size:11.5px;font-weight:500;border-radius:6px;
    padding:6px 10px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;
  }
  .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  table{width:100%;border-collapse:collapse;background:var(--paper-card);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  th{
    text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.4px;
    color:var(--ink-soft);font-weight:600;padding:7px 9px;background:#FAFBFC;border-bottom:1px solid var(--line);
  }
  td{padding:7px 9px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-mismatch{background:var(--stamp-red-bg);}
  tr.row-mismatch td{border-bottom-color:#F7D2D2;}
  .vin{font-family:'IBM Plex Mono',monospace;font-weight:500;letter-spacing:0.2px;}

  .check{font-weight:600;font-size:14px;}
  .check.yes{color:var(--stamp-teal);}
  .check.no{color:var(--stamp-red);}

  .empty{padding:20px;text-align:center;color:var(--ink-soft);font-size:12.5px;}
  hr.sep{border:none;border-top:1px solid var(--line);margin:24px 0;}
</style>
</head>
<body>
<div id="password-gate" style="position:fixed;inset:0;z-index:99999;background:#F4F6F9;display:flex;align-items:center;justify-content:center;font-family:'Inter',Arial,sans-serif;">
  <div style="background:#fff;border:1px solid #E4E7EC;border-radius:12px;box-shadow:0 4px 16px rgba(16,24,40,0.08);padding:28px 32px;max-width:340px;width:90%;text-align:center;">
    <div style="font-family:'Inter',Arial,sans-serif;font-weight:600;font-size:15px;letter-spacing:0.3px;color:#1E2A3A;margin-bottom:6px;">ACCÈS PROTÉGÉ</div>
    <p style="font-size:12.5px;color:#6B7684;margin:0 0 16px;">Identifiez-vous : votre courriel + le mot de passe de l’équipe</p>
    <input type="email" id="pg-mail" autocomplete="username" style="width:100%;padding:9px 10px;border:1px solid #E4E7EC;border-radius:8px;font-size:14px;margin-bottom:10px;box-sizing:border-box;" placeholder="prenom@groupeautomax.com">
    <input type="password" id="pg-input" style="width:100%;padding:9px 10px;border:1px solid #E4E7EC;border-radius:8px;font-size:14px;margin-bottom:10px;box-sizing:border-box;" placeholder="Mot de passe">
    <button id="pg-submit" style="width:100%;background:#2563EB;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:500;cursor:pointer;">Déverrouiller</button>
    <div id="pg-error" style="color:#B3392F;font-size:12px;margin-top:10px;display:none;">Mot de passe incorrect.</div>
  </div>
</div>
<!-- La porte etait ici, recopiee dans les neuf pages avec le mot de passe
     de l equipe ecrit en clair. Elle est maintenant dans assets/auth.js :
     connexion par courriel + code, un jeton par personne, aucun secret
     dans le code. -->
<script src="assets/auth.js"></script>

<div class="wrap">


  <div class="manifest-head">
    <!-- Logo sorti de la page : il y etait encode en texte, 83 Ko par page.
         En fichier, le navigateur le garde en memoire d une page a l autre. -->
    <img src="assets/logo.png" width="508" height="188" alt="Groupe Automax" style="width:auto;max-width:100%;height:44px;margin-bottom:14px;display:block;">
    <div class="manifest-title">Vérification d'inventaire</div>
    <p class="manifest-sub">Comparez chaque catégorie de véhicules à sa source de financement (et à Global Connect pour le Neuf) à partir de vos fichiers Excel.</p>
  </div>

  <div id="groups-container"></div>

</div>

<script>
const GROUPS = [
  {
    key: 'neuf',
    title: 'Neuf',
    sub: 'Compare l\'inventaire Neuf au Financement Neuf et à Global Connect.',
    primary: 'inv',
    compareTo: ['fin', 'gc'],
    sources: [
      { key: 'inv', label: 'Inventaire Neuf' },
      { key: 'fin', label: 'Financement Neuf' },
      { key: 'gc',  label: 'Global Connect' }
    ]
  },
  {
    key: 'usagerca',
    title: 'Usager Canada',
    sub: 'Compare l\'inventaire Usager Canada au Financement Canada.',
    primary: 'inv',
    compareTo: ['fin'],
    sources: [
      { key: 'inv', label: 'Inventaire Usager Canada' },
      { key: 'fin', label: 'Financement Canada' }
    ]
  },
  {
    key: 'us',
    title: 'US',
    sub: 'Compare l\'inventaire US au Financement UVU.',
    primary: 'inv',
    compareTo: ['fin'],
    sources: [
      { key: 'inv', label: 'Inventaire US' },
      { key: 'fin', label: 'Financement UVU' }
    ]
  }
];

const state = {}; // state[groupKey][sourceKey] = { data, headers, colIndex, vins }
GROUPS.forEach(g => {
  state[g.key] = {};
  g.sources.forEach(s => { state[g.key][s.key] = { data: null, headers: [], colIndex: -1, vins: new Set() }; });
});

function normVin(v){
  return String(v == null ? '' : v).trim().toUpperCase();
}
function detectVinColumn(headers){
  const idx = headers.findIndex(h => String(h).toLowerCase().replace(/[^a-z0-9]/g,'').includes('vin'));
  return idx;
}
function labelFor(group, key){
  const s = group.sources.find(s=>s.key===key);
  return s ? s.label : key;
}

// ---------- Construction du HTML ----------
let containerHtml = '';
GROUPS.forEach((g, gi) => {
  containerHtml += `<div class="group-section">
    <div class="group-title">${g.title}</div>
    <p class="group-sub">${g.sub}</p>
    <div class="sources" style="grid-template-columns:repeat(${g.sources.length},1fr);">
      ${g.sources.map(s => `
        <div class="source-card">
          <div class="source-label">${s.label}</div>
          <label class="file-input-wrap" id="drop-${g.key}-${s.key}">
            <span id="label-${g.key}-${s.key}">Cliquez pour choisir un fichier Excel (.xlsx / .xls)</span>
            <input type="file" id="file-${g.key}-${s.key}" accept=".xlsx,.xls,.csv">
          </label>
          <div class="col-select-row" id="colrow-${g.key}-${s.key}" style="display:none;">
            <label>Colonne contenant le VIN :</label>
            <select id="col-${g.key}-${s.key}"></select>
          </div>
          <div class="count-line" id="count-${g.key}-${s.key}"></div>
        </div>
      `).join('')}
    </div>
    <div class="compare-bar">
      <button class="compare-btn" id="compare-btn-${g.key}" disabled>Comparer — ${g.title}</button>
    </div>
    <div id="results-zone-${g.key}"><div class="empty">Téléversez les fichiers ci-dessus, puis cliquez sur « Comparer ».</div></div>
  </div>
  ${gi < GROUPS.length - 1 ? '<hr class="sep">' : ''}`;
});
document.getElementById('groups-container').innerHTML = containerHtml;

// ---------- Lecture des fichiers ----------
function handleFile(groupKey, srcKey, file){
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, { type: 'array' });
    const firstSheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: '' });
    if(rows.length === 0) return;
    const headers = rows[0];
    const body = rows.slice(1).filter(r => r.some(c => String(c).trim() !== ''));

    const s = state[groupKey][srcKey];
    s.data = body;
    s.headers = headers;

    const select = document.getElementById(`col-${groupKey}-${srcKey}`);
    select.innerHTML = headers.map((h,i) => `<option value="${i}">${h || '(colonne ' + (i+1) + ')'}</option>`).join('');
    const detected = detectVinColumn(headers);
    select.value = detected !== -1 ? detected : 0;
    s.colIndex = parseInt(select.value, 10);

    document.getElementById(`colrow-${groupKey}-${srcKey}`).style.display = 'flex';
    document.getElementById(`label-${groupKey}-${srcKey}`).textContent = file.name;
    document.getElementById(`drop-${groupKey}-${srcKey}`).classList.add('loaded');

    updateVinSet(groupKey, srcKey);
    checkReadyToCompare(groupKey);
  };
  reader.readAsArrayBuffer(file);
}

function updateVinSet(groupKey, srcKey){
  const s = state[groupKey][srcKey];
  const idx = s.colIndex;
  const vins = new Set();
  (s.data || []).forEach(row => {
    const v = normVin(row[idx]);
    if(v) vins.add(v);
  });
  s.vins = vins;
  document.getElementById(`count-${groupKey}-${srcKey}`).innerHTML = `<b>${vins.size}</b> VIN détectés`;
}

GROUPS.forEach(g => {
  g.sources.forEach(s => {
    document.getElementById(`file-${g.key}-${s.key}`).addEventListener('change', (e) => {
      const file = e.target.files[0];
      if(file) handleFile(g.key, s.key, file);
    });
    document.getElementById(`col-${g.key}-${s.key}`).addEventListener('change', (e) => {
      state[g.key][s.key].colIndex = parseInt(e.target.value, 10);
      updateVinSet(g.key, s.key);
    });
  });
});

function checkReadyToCompare(groupKey){
  const g = GROUPS.find(x=>x.key===groupKey);
  const ready = g.sources.every(s => state[groupKey][s.key].data !== null);
  document.getElementById(`compare-btn-${groupKey}`).disabled = !ready;
}

// ---------- Comparaison ----------
const groupResults = {}; // groupResults[groupKey] = { rows: [...], currentFilter, searchTerm }

GROUPS.forEach(g => {
  document.getElementById(`compare-btn-${g.key}`).addEventListener('click', () => {
    runComparison(g);
  });
});

function runComparison(g){
  const gs = state[g.key];
  const diffs = []; // { title, vins, color, bg }

  g.compareTo.forEach(cmpKey => {
    const primaryVins = gs[g.primary].vins;
    const cmpVins = gs[cmpKey].vins;
    const onlyPrimary = [...primaryVins].filter(v => !cmpVins.has(v)).sort();
    const onlyCmp = [...cmpVins].filter(v => !primaryVins.has(v)).sort();
    diffs.push({ title: `Dans ${labelFor(g,g.primary)} mais absents de ${labelFor(g,cmpKey)}`, vins: onlyPrimary, color: 'var(--stamp-red)', bg: 'var(--stamp-red-bg)' });
    diffs.push({ title: `Dans ${labelFor(g,cmpKey)} mais absents de ${labelFor(g,g.primary)}`, vins: onlyCmp, color: 'var(--stamp-amber)', bg: 'var(--stamp-amber-bg)' });
  });

  const allVins = new Set();
  g.sources.forEach(s => gs[s.key].vins.forEach(v => allVins.add(v)));
  const rows = Array.from(allVins).sort().map(vin => {
    const row = { vin };
    g.sources.forEach(s => { row[s.key] = gs[s.key].vins.has(vin); });
    row._allPresent = g.sources.every(s => row[s.key]);
    return row;
  });

  groupResults[g.key] = { rows, currentFilter: 'mismatch', searchTerm: '' };
  renderGroupResults(g, diffs);
}

function vinListBlock(title, vins, color, bg){
  let html = `<div style="font-size:13px;font-weight:600;color:${color};margin-bottom:6px;">${title} (${vins.length})</div>`;
  if(vins.length === 0){
    html += `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:18px;">Aucun — pas d'écart sur ce point.</div>`;
  } else {
    html += `<div style="border:1px solid ${bg};background:${bg};padding:10px 12px;margin-bottom:18px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:2;max-height:260px;overflow-y:auto;">`;
    html += vins.join('<br>');
    html += `</div>`;
  }
  return html;
}

function renderGroupResults(g, diffs){
  const gs = state[g.key];
  const totalEcarts = diffs.reduce((sum,d) => sum + d.vins.length, 0);

  const statCols = g.sources.length + 1;
  let html = `
    <div class="stats" style="grid-template-columns:repeat(${statCols},1fr);">
      ${g.sources.map(s => `<div class="stat"><div class="num">${gs[s.key].vins.size}</div><div class="lbl">VIN — ${s.label}</div></div>`).join('')}
      <div class="stat alert"><div class="num">${totalEcarts}</div><div class="lbl">Écarts détectés (total)</div></div>
    </div>

    <div style="background:var(--paper-card);border:1px solid var(--line);padding:18px;margin-bottom:20px;">
      ${diffs.map(d => vinListBlock(d.title, d.vins, d.color, d.bg)).join('')}
    </div>

    <div style="text-align:center;margin-bottom:14px;">
      <button class="filter-btn" id="toggle-full-table-${g.key}">Voir le tableau complet</button>
    </div>

    <div id="full-table-zone-${g.key}" style="display:none;">
      <div class="toolbar">
        <input type="text" class="search-input" id="search-${g.key}" placeholder="Rechercher un VIN...">
        <button class="filter-btn active" data-filter="mismatch" data-group="${g.key}">Écarts seulement</button>
        <button class="filter-btn" data-filter="all" data-group="${g.key}">Tous les VIN</button>
      </div>
      <table>
        <thead>
          <tr><th>VIN</th>${g.sources.map(s => `<th style="text-align:center;">${s.label}</th>`).join('')}</tr>
        </thead>
        <tbody id="results-tbody-${g.key}"></tbody>
      </table>
      <div class="empty" id="results-empty-${g.key}" style="display:none;">Aucun véhicule ne correspond à ce filtre.</div>
    </div>
  `;
  document.getElementById(`results-zone-${g.key}`).innerHTML = html;

  document.getElementById(`toggle-full-table-${g.key}`).addEventListener('click', (e)=>{
    const zone = document.getElementById(`full-table-zone-${g.key}`);
    const showing = zone.style.display !== 'none';
    zone.style.display = showing ? 'none' : 'block';
    e.target.textContent = showing ? 'Voir le tableau complet' : 'Masquer le tableau complet';
    if(!showing) renderGroupTable(g);
  });

  document.querySelectorAll(`.filter-btn[data-group="${g.key}"]`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll(`.filter-btn[data-group="${g.key}"]`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      groupResults[g.key].currentFilter = btn.dataset.filter;
      renderGroupTable(g);
    });
  });
  document.getElementById(`search-${g.key}`).addEventListener('input', (e)=>{
    groupResults[g.key].searchTerm = e.target.value.toUpperCase();
    renderGroupTable(g);
  });
}

function renderGroupTable(g){
  const gr = groupResults[g.key];
  let list = gr.rows.slice();
  if(gr.currentFilter === 'mismatch') list = list.filter(r => !r._allPresent);
  if(gr.searchTerm) list = list.filter(r => r.vin.includes(gr.searchTerm));

  const tbody = document.getElementById(`results-tbody-${g.key}`);
  const emptyMsg = document.getElementById(`results-empty-${g.key}`);
  tbody.innerHTML = '';
  if(list.length === 0){ emptyMsg.style.display = 'block'; return; }
  emptyMsg.style.display = 'none';

  list.forEach(r => {
    const tr = document.createElement('tr');
    if(!r._allPresent) tr.classList.add('row-mismatch');
    const mark = (b) => `<span class="check ${b?'yes':'no'}">${b?'✓':'✕'}</span>`;
    tr.innerHTML = `
      <td class="vin">${r.vin}</td>
      ${g.sources.map(s => `<td style="text-align:center;">${mark(r[s.key])}</td>`).join('')}
    `;
    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
