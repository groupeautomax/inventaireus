<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Inscription acheteur</title>
<!-- 14 oct. 2026 : pays en premier (Canada, États-Unis, France) et numéros selon le pays. -->
<style>
  :root {
    --vert: #008a44;
    --texte: #16181c;
    --doux: #6b7280;
    --trait: #e6e8ec;
    --fond: #f6f7f9;
    --carte: #ffffff;
    --rayon: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fond); color: var(--texte); line-height: 1.45;
  }
  header {
    background: var(--carte); border-bottom: 1px solid var(--trait);
    padding: 14px 16px; position: sticky; top: 0; z-index: 10;
  }
  .rangee { display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; }
  .marque { font-weight: 700; color: var(--vert); font-size: 16px; }
  .pousse { margin-left: auto; }
  .langues { display: flex; border: 1px solid var(--trait); border-radius: 999px; overflow: hidden; }
  .langues button {
    border: 0; background: transparent; padding: 6px 12px;
    font: inherit; font-size: 13px; color: var(--doux); cursor: pointer;
  }
  .langues button[aria-pressed="true"] { background: var(--vert); color: #fff; font-weight: 600; }

  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .bloc {
    background: var(--carte); border: 1px solid var(--trait);
    border-radius: var(--rayon); padding: 18px; margin-bottom: 14px;
  }
  h1 { font-size: 21px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.3px; }
  h2 { font-size: 17px; margin: 18px 0 4px; }
  .aide { color: var(--doux); font-size: 14px; margin: 0 0 12px; }
  label { display: block; font-size: 14px; color: var(--doux); margin: 12px 0 5px; }
  input, select {
    width: 100%; padding: 12px 13px; font: inherit; font-size: 16px;
    border: 1px solid var(--trait); border-radius: 10px;
    background: var(--fond); color: var(--texte);
  }
  input:focus, select:focus { outline: 2px solid var(--vert); outline-offset: -1px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .trio { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .duo, .trio { grid-template-columns: 1fr; gap: 0; } }
  .boutons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  button.principal {
    padding: 14px 18px; font: inherit; font-size: 16px; font-weight: 650;
    border-radius: 12px; cursor: pointer; border: 0; background: var(--vert); color: #fff; flex: 1 1 auto;
  }
  button:disabled { opacity: .55; cursor: default; }
  .alerte { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 15px; }
  .alerte.mauvais { background: #fdf0e8; color: #8a4b1d; }
  .alerte.bon { background: #e7f5ed; color: #0a6136; }
  .message { text-align: center; padding: 56px 20px; color: var(--doux); }
  .message strong { display: block; color: var(--texte); font-size: 17px; margin-bottom: 6px; }
  .recap { display: grid; grid-template-columns: 1fr 2fr; gap: 6px 14px; font-size: 14px; margin-top: 12px; }
  .recap .k { color: var(--doux); }
  footer { text-align: center; color: var(--doux); font-size: 13px; padding: 28px 16px 40px; }

  @media (prefers-color-scheme: dark) {
    :root { --texte: #f2f3f5; --doux: #9aa1ab; --trait: #2a2d33; --fond: #121316; --carte: #1b1d21; }
    .alerte.mauvais { background: #3a2415; color: #f0b98b; }
    .alerte.bon { background: #12331f; color: #8fd9b0; }
  }
</style>
</head>
<body>

<header>
  <div class="rangee">
    <span class="marque" id="marque"></span>
    <div class="pousse langues">
      <button type="button" data-langue="fr">FR</button>
      <button type="button" data-langue="en">EN</button>
    </div>
  </div>
</header>

<main>
  <div id="contenu" hidden>
    <div class="bloc" id="blocForm"></div>
  </div>
  <div class="message" id="message"></div>
</main>

<footer id="pied"></footer>

<script>
/* ---------------------------------------------------------------------------
   Inscription d'un concessionnaire acheteur (Acheteurs.gs). Lien reçu par
   courriel : acheteur.html?i=<id>&j=<jeton>. Même adresse que les autres pages.
   --------------------------------------------------------------------------- */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwZsbAEELfW5Ce80l3v39unBI6L3js8IQ3iYilrGDNK2zUzlv16XxkoZYZuf4t3tgfX/exec";

const PROVINCES = [
  ["QC", "Québec", "Quebec"], ["ON", "Ontario", "Ontario"], ["NB", "Nouveau-Brunswick", "New Brunswick"],
  ["NS", "Nouvelle-Écosse", "Nova Scotia"], ["PE", "Île-du-Prince-Édouard", "Prince Edward Island"],
  ["NL", "Terre-Neuve-et-Labrador", "Newfoundland and Labrador"], ["MB", "Manitoba", "Manitoba"],
  ["SK", "Saskatchewan", "Saskatchewan"], ["AB", "Alberta", "Alberta"], ["BC", "Colombie-Britannique", "British Columbia"],
  ["YT", "Yukon", "Yukon"], ["NT", "Territoires du Nord-Ouest", "Northwest Territories"], ["NU", "Nunavut", "Nunavut"]
];
const ETATS = ["AL","AK","AZ","AR","CA","CO","CT","DE","DC","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];
/* 14 oct. 2026 (Maxime) : le pays d'abord — Canada, États-Unis, France — puis les numéros que ce pays exige.
   France : SIRET, TVA intracommunautaire, APE/NAF (4511Z obligatoire), EORI (importations), RCS, RNE. */
const PAYS = ["CA", "US", "FR"];

const T = {
  fr: {
    titre: "Inscrire ma concession",
    intro: n => "Vos coordonnées servent à pré-remplir vos offres et vos contrats de vente avec " + (n || "nous") + ". Deux minutes, une seule fois.",
    paysTitre: "Pays de votre entreprise", paysAide: "Choisissez d'abord le pays : les numéros demandés en dépendent.",
    CA: "Canada", US: "États-Unis", FR: "France",
    entreprise: "Entreprise", nomLegal: "Nom légal de l'entreprise", nomLegalFR: "Raison sociale", nomCommercial: "Nom commercial (si différent)", nomCommercialFR: "Enseigne (si différente)",
    contact: "Personne-ressource", signataire: "Nom du signataire", telephone: "Téléphone", telephoneAide: { CA: "Ex. 514 555-0123", US: "Ex. (518) 555-0199", FR: "Ex. 06 12 34 56 78 ou +33 6 12 34 56 78" }, courriel: "Courriel",
    adresseTitre: "Adresse d'affaires", adresse: "Adresse", ville: "Ville", province: "Province", etat: "État", codePostal: "Code postal", zip: "ZIP code",

    noConcessionnaire: "Numéro de permis de commerçant (SAAQ, OMVIC, AMVIC…)", noEntreprise: "Numéro d'entreprise (NEQ ou BN)", tps: "No TPS/TVH", tvq: "No TVQ (Québec)",
    ein: "EIN (Federal Tax ID)", einAide: "Format 12-3456789", licence: "Numéro de licence de concessionnaire (dealer license)", certificatRevente: "Certificat de revente / permis de taxe de vente",
    siret: "SIRET", siretAide: "14 chiffres (SIREN + établissement)", tvaIntra: "TVA intracommunautaire", tvaAide: "FR + 2 caractères + SIREN (ex. FR12 732829320)",
    ape: "Code APE / NAF", apeAide: "4511Z obligatoire — commerce de voitures et de véhicules automobiles légers", eori: "Numéro EORI", eoriAide: "FR + SIRET — indispensable pour les importations",
    rcs: "RCS (greffe et numéro)", rcsAide: "Ex. RCS Lyon 732 829 320", rne: "RNE (Registre national des entreprises)", rneAide: "En général le SIREN",
    langueTitre: "Langue des communications", envoyer: "Enregistrer ma concession", envoiEnCours: "Enregistrement…",
    merciTitre: "Votre concession est inscrite",
    merci: n => "Merci ! Vos offres et contrats de vente avec " + (n || "nous") + " seront pré-remplis avec ces coordonnées. Un courriel de confirmation vient de partir. Pour modifier quelque chose, rouvrez simplement ce lien.",
    dejaInscrit: "Fiche déjà remplie : vous pouvez la corriger ci-dessous.",
    chargement: "Un instant…",
    LIEN_INVALIDE: "Ce lien n'est plus valide. Demandez une nouvelle invitation à votre représentant.",
    RESEAU: "Impossible de joindre le serveur. Vérifiez la connexion, puis réessayez.",

    contact: "Contact person", signataire: "Signatory name", telephone: "Phone", telephoneAide: { CA: "e.g. 514 555-0123", US: "e.g. (518) 555-0199", FR: "e.g. 06 12 34 56 78 or +33 6 12 34 56 78" }, courriel: "Email",
    adresseTitre: "Business address", adresse: "Address", ville: "City", province: "Province", etat: "State", codePostal: "Postal code", zip: "ZIP code",
    numerosTitre: "Business numbers",
    noConcessionnaire: "Dealer licence number (SAAQ, OMVIC, AMVIC…)", noEntreprise: "Business number (NEQ or BN)", tps: "GST/HST no.", tvq: "QST no. (Quebec)",
    ein: "EIN (Federal Tax ID)", einAide: "Format 12-3456789", licence: "Dealer license number", certificatRevente: "Resale certificate / sales tax permit",
    siret: "SIRET", siretAide: "14 digits (SIREN + establishment)", tvaIntra: "Intra-community VAT number", tvaAide: "FR + 2 characters + SIREN (e.g. FR12 732829320)",
    ape: "APE / NAF code", apeAide: "4511Z required — sale of cars and light motor vehicles", eori: "EORI number", eoriAide: "FR + SIRET — required for imports",
    rcs: "RCS (registry and number)", rcsAide: "e.g. RCS Lyon 732 829 320", rne: "RNE (national business register)", rneAide: "Usually the SIREN",
    langueTitre: "Language for communications", envoyer: "Save my dealership", envoiEnCours: "Saving…",
    merciTitre: "Your dealership is registered",
    merci: n => "Thank you! Your offers and bills of sale with " + (n || "us") + " will be pre-filled with these details. A confirmation email is on its way. To change anything, simply reopen this link.",
    dejaInscrit: "Already filled in: you can correct it below.",
    chargement: "One moment…",
    LIEN_INVALIDE: "This link is no longer valid. Ask your representative for a new invitation.",
    RESEAU: "Could not reach the server. Check your connection and try again.",
    ERREUR: "Something went wrong. Please try again shortly.",
    NOM_REQUIS: "Enter the legal company name.",
    ADRESSE_REQUISE: "Enter the address and city.",
    TELEPHONE_REQUIS: "Enter a phone number.",
    SIGNATAIRE_REQUIS: "Enter the contact person's name.",
    COURRIEL_INVALIDE: "The email address is invalid.",
    COURRIEL_PRIS: "This email already belongs to another record. Write to us to merge them.",
    PAYS_REQUIS: "Choose the country of your business.",
    PERMIS_REQUIS: "Enter your dealer licence number.",
    PROVINCE_REQUISE: "Choose the province.",
    EIN_REQUIS: "Enter your EIN (Federal Tax ID).", EIN_INVALIDE: "The EIN has 9 digits (12-3456789).",
    LICENCE_REQUISE: "Enter your dealer license number.", ETAT_REQUIS: "Choose the state.",
    SIRET_REQUIS: "Enter your SIRET.", SIRET_INVALIDE: "The SIRET has 14 digits.",
    TVA_REQUISE: "Enter your intra-community VAT number.", TVA_INVALIDE: "Expected VAT number: FR + 2 characters + 9 digits.", TVA_SIREN: "The SIREN in the VAT number does not match the SIRET.",
    APE_REQUIS: "Enter your APE / NAF code.", APE_INVALIDE: "The APE / NAF code must be 4511Z (sale of cars and light motor vehicles) to buy vehicles.",
    EORI_REQUIS: "Enter your EORI number (required for imports).", EORI_INVALIDE: "Expected EORI: FR followed by your SIRET (16 characters).", EORI_SIRET: "The EORI must be FR followed by your SIRET.",
    CODE_POSTAL_REQUIS: "Enter the postal code.",
    pied: n => (n || "Registration") + " — reserved for our buyers."
  }
};

function langueChoisie() {
  try { const g = localStorage.getItem("automaxLangue"); if (g === "fr" || g === "en") return g; } catch (e) {}
  return (navigator.language || "fr").toLowerCase().indexOf("en") === 0 ? "en" : "fr";
}
let langue = langueChoisie();
let fiche = null;
let vendeurNom = "";
let termine = false;
const brouillon = {};
function t() { return T[langue]; }

const params = new URLSearchParams(location.search);
const idFiche = params.get("i") || "";
const jeton = params.get("j") || "";

function echappe(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function valeur(id, defaut) {
  const el = document.getElementById(id);
  if (el) return el.type === "checkbox" ? el.checked : el.value;
  return (id in brouillon) ? brouillon[id] : (defaut == null ? "" : defaut);
}
function memoriserSaisie() {
  document.querySelectorAll("#blocForm input, #blocForm select").forEach(el => { brouillon[el.id] = el.value; });
}
function afficherMessage(texte, titre) {
  const el = document.getElementById("message");
  el.innerHTML = (titre ? "<strong>" + echappe(titre) + "</strong>" : "") + echappe(texte);
  el.hidden = false;
  document.getElementById("contenu").hidden = true;
}
function erreur(code) {
  const el = document.getElementById("erreur");
  if (!el) return;
  el.textContent = t()[code] || t().ERREUR;
  el.hidden = false;
  el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function appliquerTextes() {
  document.documentElement.lang = langue;
  document.querySelectorAll(".langues button").forEach(b => b.setAttribute("aria-pressed", b.dataset.langue === langue ? "true" : "false"));
  document.title = (vendeurNom ? vendeurNom + " — " : "") + t().titre;
  document.getElementById("marque").textContent = vendeurNom;
  document.getElementById("pied").textContent = t().pied(vendeurNom);
  if (fiche) dessiner();
}

function champ(id, libelle, defaut, attrs, aide) {
  return '<label for="' + id + '">' + echappe(libelle) + '</label><input id="' + id + '" value="' + echappe(valeur(id, defaut)) + '" ' + (attrs || "") + ">" + (aide ? '<div class="aide" style="margin:4px 0 0;font-size:13px">' + echappe(aide) + "</div>" : "");
}
function paysDe(a) {
  const brouillonPays = ("pays" in brouillon) ? brouillon.pays : "";
  if (PAYS.indexOf(brouillonPays) >= 0) return brouillonPays;
  if (a && PAYS.indexOf(String(a.paysCode || "").toUpperCase()) >= 0) return String(a.paysCode).toUpperCase();
  const p = String((a && a.pays) || "").toLowerCase();
  if (/états-unis|etats-unis|united states/.test(p)) return "US";
  if (/france/.test(p)) return "FR";
  if (/canada/.test(p)) return "CA";
  return "";
}

function dessiner() {
  const a = fiche;
  const bloc = document.getElementById("blocForm");
  if (termine) {
    const pays = paysDe(a);
    let recap = '<span class="k">' + echappe(t().nomLegal) + "</span><span>" + echappe(a.nomLegal) + "</span>" +
      '<span class="k">' + echappe(t().signataire) + "</span><span>" + echappe(a.signataire) + "</span>" +
      '<span class="k">' + echappe(t().adresse) + "</span><span>" + echappe([a.adresse, a.ville, a.province, a.codePostal, t()[pays] || a.pays].filter(Boolean).join(", ")) + "</span>";
    if (pays === "FR") recap += '<span class="k">SIRET</span><span>' + echappe(a.siret || "—") + "</span>" + '<span class="k">' + echappe(t().tvaIntra) + "</span><span>" + echappe(a.tvaIntra || "—") + "</span>" + '<span class="k">APE / NAF</span><span>' + echappe(a.ape || "—") + "</span>" + '<span class="k">EORI</span><span>' + echappe(a.eori || "—") + "</span>" + (a.rcs ? '<span class="k">RCS</span><span>' + echappe(a.rcs) + "</span>" : "") + (a.rne ? '<span class="k">RNE</span><span>' + echappe(a.rne) + "</span>" : "");
    else if (pays === "US") recap += '<span class="k">EIN</span><span>' + echappe(a.ein || "—") + "</span>" + '<span class="k">' + echappe(t().licence) + "</span><span>" + echappe(a.noConcessionnaire || "—") + (a.licenceEtat ? " (" + echappe(a.licenceEtat) + ")" : "") + "</span>" + (a.certificatRevente ? '<span class="k">' + echappe(t().certificatRevente) + "</span><span>" + echappe(a.certificatRevente) + "</span>" : "");
    else recap += '<span class="k">' + echappe(t().noConcessionnaire) + "</span><span>" + echappe(a.noConcessionnaire || "—") + "</span>" + (a.noEntreprise ? '<span class="k">' + echappe(t().noEntreprise) + "</span><span>" + echappe(a.noEntreprise) + "</span>" : "") + '<span class="k">' + echappe(t().tps) + "</span><span>" + echappe(a.tps || "—") + "</span>";
    bloc.innerHTML = "<h1>" + echappe(t().merciTitre) + "</h1><p class=\"aide\">" + echappe(t().merci(vendeurNom)) + "</p>" + '<div class="recap">' + recap + "</div>";
    return;
  }
  const pays = paysDe(a);
  let h = "<h1>" + echappe(t().titre) + "</h1><p class=\"aide\">" + echappe(t().intro(vendeurNom)) + "</p>";
  if (a.statut === "inscrit") h += '<div class="alerte bon" style="margin:0 0 6px">' + echappe(t().dejaInscrit) + "</div>";
  h += '<form id="form" novalidate>';
  // 1. Le pays d'abord.
  h += "<h2>" + echappe(t().paysTitre) + "</h2><p class=\"aide\">" + echappe(t().paysAide) + "</p>";
  h += '<select id="pays" required><option value=""' + (pays ? "" : " selected") + ">—</option>" + PAYS.map(p => '<option value="' + p + '"' + (p === pays ? " selected" : "") + ">" + echappe(t()[p]) + "</option>").join("") + "</select>";
  if (pays) {
    h += "<h2>" + echappe(t().entreprise) + "</h2>";
    h += '<div class="duo"><div>' + champ("nomLegal", pays === "FR" ? t().nomLegalFR : t().nomLegal, a.nomLegal, 'autocomplete="organization" required') + "</div>";
    h += "<div>" + champ("nomCommercial", pays === "FR" ? t().nomCommercialFR : t().nomCommercial, a.nomCommercial) + "</div></div>";
    h += "<h2>" + echappe(t().contact) + "</h2>";
    h += '<div class="duo"><div>' + champ("signataire", t().signataire, a.signataire, 'autocomplete="name" required') + "</div>";
    h += "<div>" + champ("telephone", t().telephone, a.telephone, 'type="tel" autocomplete="tel" inputmode="tel" required placeholder="' + echappe(t().telephoneAide[pays]) + '"') + "</div></div>";
    h += champ("courriel", t().courriel, a.courriel, 'type="email" autocomplete="email" inputmode="email" required');
    h += "<h2>" + echappe(t().adresseTitre) + "</h2>";
    h += champ("adresse", t().adresse, a.adresse, 'autocomplete="street-address" required');
    if (pays === "FR") {
      h += '<div class="duo"><div>' + champ("codePostal", t().codePostal, a.codePostal, 'autocomplete="postal-code" inputmode="numeric" required') + "</div><div>" + champ("ville", t().ville, a.ville, 'autocomplete="address-level2" required') + "</div></div>";
    } else {
      h += '<div class="trio"><div>' + champ("ville", t().ville, a.ville, 'autocomplete="address-level2" required') + "</div>";
      h += '<div><label for="province">' + echappe(pays === "CA" ? t().province : t().etat) + "</label>";
      if (pays === "CA") {
        const choisi = valeur("province", a.province || "QC");
        h += '<select id="province">' + PROVINCES.map(p => '<option value="' + p[0] + '"' + (p[0] === choisi ? " selected" : "") + ">" + echappe(langue === "en" ? p[2] : p[1]) + "</option>").join("") + "</select>";
      } else {
        const choisiE = String(valeur("province", a.province) || "").toUpperCase();
        h += '<select id="province"><option value=""' + (choisiE ? "" : " selected") + ">—</option>" + ETATS.map(e => '<option value="' + e + '"' + (e === choisiE ? " selected" : "") + ">" + e + "</option>").join("") + "</select>";
      }
      h += "</div><div>" + champ("codePostal", pays === "US" ? t().zip : t().codePostal, a.codePostal, 'autocomplete="postal-code"') + "</div></div>";
    }
    h += "<h2>" + echappe(t().numerosTitre) + "</h2>";
    if (pays === "FR") {
      h += '<div class="duo"><div>' + champ("siret", t().siret, a.siret, 'inputmode="numeric" required placeholder="732 829 320 00074"', t().siretAide) + "</div><div>" + champ("tvaIntra", t().tvaIntra, a.tvaIntra, 'required placeholder="FR12 732829320"', t().tvaAide) + "</div></div>";
      h += '<div class="duo"><div>' + champ("ape", t().ape, a.ape || "4511Z", 'required placeholder="4511Z"', t().apeAide) + "</div><div>" + champ("eori", t().eori, a.eori, 'required placeholder="FR73282932000074"', t().eoriAide) + "</div></div>";
      h += '<div class="duo"><div>' + champ("rcs", t().rcs, a.rcs, 'placeholder="RCS Lyon 732 829 320"', t().rcsAide) + "</div><div>" + champ("rne", t().rne, a.rne, 'inputmode="numeric"', t().rneAide) + "</div></div>";
    } else if (pays === "US") {
      h += '<div class="duo"><div>' + champ("ein", t().ein, a.ein, 'required inputmode="numeric" placeholder="12-3456789"', t().einAide) + "</div><div>" + champ("noConcessionnaire", t().licence, a.noConcessionnaire, "required") + "</div></div>";
      h += champ("certificatRevente", t().certificatRevente, a.certificatRevente);
    } else {
      h += champ("noConcessionnaire", t().noConcessionnaire, a.noConcessionnaire, "required");
      h += '<div class="trio"><div>' + champ("noEntreprise", t().noEntreprise, a.noEntreprise) + "</div><div>" + champ("tps", t().tps, a.tps) + "</div><div>" + champ("tvq", t().tvq, a.tvq) + "</div></div>";
    }
    h += "<h2>" + echappe(t().langueTitre) + "</h2>";
    const lg = valeur("langueCom", a.langue || langue);
    h += '<select id="langueCom"><option value="fr"' + (lg === "fr" ? " selected" : "") + '>Français</option><option value="en"' + (lg === "en" ? " selected" : "") + ">English</option></select>";
    h += '<div class="boutons"><button type="submit" class="principal" id="btnEnvoyer">' + echappe(t().envoyer) + "</button></div>";
  }
  h += '<div class="alerte mauvais" id="erreur" hidden></div>';
  h += "</form>";
  bloc.innerHTML = h;
  document.getElementById("form").addEventListener("submit", ev => { ev.preventDefault(); envoyer(); });
  document.getElementById("pays").addEventListener("change", () => {
    memoriserSaisie();
    const nouveau = valeur("pays");
    brouillon.pays = nouveau;
    brouillon.province = nouveau === "CA" ? "QC" : "";
    dessiner();
  });
  // France : l'EORI et le RNE se déduisent du SIRET (modifiables).
  const siretEl = document.getElementById("siret");
  if (siretEl) siretEl.addEventListener("input", () => {
    const chiffres = siretEl.value.replace(/\D/g, "");
    const eori = document.getElementById("eori"), rne = document.getElementById("rne");
    if (eori && (!eori.value || /^FR\d*$/.test(eori.value.replace(/\s/g, "").toUpperCase()))) eori.value = chiffres.length === 14 ? "FR" + chiffres : (chiffres ? "FR" + chiffres : "");
    if (rne && (!rne.value || /^\d*$/.test(rne.value))) rne.value = chiffres.slice(0, 9);
  });
}

async function envoyer() {
  memoriserSaisie();
  const paysCode = valeur("pays", "");
  if (!paysCode) { erreur("PAYS_REQUIS"); return; }
  const acheteur = {
    paysCode: paysCode,
    nomLegal: valeur("nomLegal").trim(), nomCommercial: valeur("nomCommercial").trim(), signataire: valeur("signataire").trim(),
    telephone: valeur("telephone").trim(), courriel: valeur("courriel").trim(),
    adresse: valeur("adresse").trim(), ville: valeur("ville").trim(), province: String(valeur("province") || "").trim(), codePostal: valeur("codePostal").trim(),
    pays: t()[paysCode],
    noConcessionnaire: valeur("noConcessionnaire").trim(), noEntreprise: valeur("noEntreprise").trim(), tps: valeur("tps").trim(), tvq: valeur("tvq").trim(),
    ein: valeur("ein").trim(), certificatRevente: valeur("certificatRevente").trim(),
    siret: valeur("siret").trim(), tvaIntra: valeur("tvaIntra").trim(), ape: valeur("ape").trim(), eori: valeur("eori").trim(), rcs: valeur("rcs").trim(), rne: valeur("rne").trim(),
    langue: valeur("langueCom", langue)
  };
  if (acheteur.nomLegal.length < 2) { erreur("NOM_REQUIS"); return; }
  if (!acheteur.signataire) { erreur("SIGNATAIRE_REQUIS"); return; }
  if (!acheteur.telephone) { erreur("TELEPHONE_REQUIS"); return; }
  if (acheteur.courriel.indexOf("@") < 1) { erreur("COURRIEL_INVALIDE"); return; }
  if (!acheteur.adresse || !acheteur.ville) { erreur("ADRESSE_REQUISE"); return; }
  if (paysCode === "FR") {
    if (!acheteur.codePostal) { erreur("CODE_POSTAL_REQUIS"); return; }
    const siret = acheteur.siret.replace(/\D/g, "");
    if (!siret) { erreur("SIRET_REQUIS"); return; }
    if (siret.length !== 14) { erreur("SIRET_INVALIDE"); return; }
    const tva = acheteur.tvaIntra.replace(/[\s.-]/g, "").toUpperCase();
    if (!tva) { erreur("TVA_REQUISE"); return; }
    if (!/^FR[0-9A-Z]{2}\d{9}$/.test(tva)) { erreur("TVA_INVALIDE"); return; }
    if (tva.slice(-9) !== siret.slice(0, 9)) { erreur("TVA_SIREN"); return; }
    const ape = acheteur.ape.replace(/[\s.]/g, "").toUpperCase();
    if (!ape) { erreur("APE_REQUIS"); return; }
    if (ape !== "4511Z") { erreur("APE_INVALIDE"); return; }
    const eori = acheteur.eori.replace(/[\s.-]/g, "").toUpperCase();
    if (!eori) { erreur("EORI_REQUIS"); return; }
    if (!/^FR\d{14}$/.test(eori)) { erreur("EORI_INVALIDE"); return; }
    if (eori.slice(2) !== siret) { erreur("EORI_SIRET"); return; }
  } else if (paysCode === "US") {
    const ein = acheteur.ein.replace(/\D/g, "");
    if (!ein) { erreur("EIN_REQUIS"); return; }
    if (ein.length !== 9) { erreur("EIN_INVALIDE"); return; }
    if (!acheteur.noConcessionnaire) { erreur("LICENCE_REQUISE"); return; }
    if (!acheteur.province) { erreur("ETAT_REQUIS"); return; }
  } else {
    if (!acheteur.noConcessionnaire) { erreur("PERMIS_REQUIS"); return; }
    if (!acheteur.province) { erreur("PROVINCE_REQUISE"); return; }
  }
  const bouton = document.getElementById("btnEnvoyer");
  bouton.disabled = true; bouton.textContent = t().envoiEnCours;
  try {
    const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "acheteurExterneInscrire", i: idFiche, j: jeton, langue: acheteur.langue, acheteur: acheteur }) });
    const j = await r.json();
    if (!j.ok) { bouton.disabled = false; bouton.textContent = t().envoyer; erreur(j.code || "ERREUR"); return; }
    fiche = j.acheteur || Object.assign({}, fiche, acheteur, { statut: "inscrit" });
    termine = true;
    dessiner();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    bouton.disabled = false; bouton.textContent = t().envoyer; erreur("RESEAU");
  }
}

async function charger() {
  if (!idFiche || !jeton) { afficherMessage(t().LIEN_INVALIDE, ""); return; }
  afficherMessage(t().chargement, "");
  try {
    const r = await fetch(SCRIPT_URL + "?ficheAcheteur=" + encodeURIComponent(idFiche) + "&j=" + encodeURIComponent(jeton) + "&_=" + Date.now());
    const j = await r.json();
    if (!j.ok) { afficherMessage(t()[j.code] || t().RESEAU, ""); return; }
    fiche = j.acheteur || {};
    vendeurNom = (j.vendeur && j.vendeur.nom) || "";
    let choisie = null;
    try { choisie = localStorage.getItem("automaxLangue"); } catch (e) {}
    if (!choisie && (j.langue === "fr" || j.langue === "en")) langue = j.langue;
    document.getElementById("message").hidden = true;
    document.getElementById("contenu").hidden = false;
    appliquerTextes();
  } catch (e) {
    afficherMessage(t().RESEAU, "");
  }
}

document.querySelectorAll(".langues button").forEach(b => {
  b.addEventListener("click", () => {
    memoriserSaisie();
    langue = b.dataset.langue;
    try { localStorage.setItem("automaxLangue", langue); } catch (e) {}
    appliquerTextes();
  });
});

appliquerTextes();
charger();
</script>
