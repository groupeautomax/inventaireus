<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Portail des acheteurs</title>
<!-- 5 nov. 2026 : portail des acheteurs externes (PortailAcheteurs.gs). L'acheteur approuvé voit le stock
     mis en vente pour son pays et peut l'acheter au prix demandé ou faire une offre ; la suite (contre-offre,
     contrat, signature, transport) se fait sur offre.html?o=<id>, comme pour la vitrine. -->
<style>
  :root {
    --vert: #008a44; --vert-fonce: #006b35; --ambre: #955f10; --rouge: #b42318;
    --texte: #16181c; --doux: #5f6978; --trait: #e6e8ec; --fond: #f6f7f9; --carte: #ffffff; --rayon: 14px;
    --vert-pale: #e7f5ed; --ambre-pale: #fdf0e0; --rouge-pale: #fde8e6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--fond); color: var(--texte); line-height: 1.45; }
  header { background: var(--carte); border-bottom: 1px solid var(--trait); padding: 12px 16px; position: sticky; top: 0; z-index: 20; }
  .rangee { display: flex; align-items: center; gap: 12px; max-width: 1180px; margin: 0 auto; flex-wrap: wrap; }
  .marque { font-weight: 750; color: var(--vert); font-size: 16px; }
  .marque small { display: block; color: var(--doux); font-weight: 500; font-size: 13px; }
  .pousse { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .langues { display: flex; border: 1px solid var(--trait); border-radius: 999px; overflow: hidden; }
  .langues button { border: 0; background: transparent; padding: 6px 12px; font: inherit; font-size: 13px; color: var(--doux); cursor: pointer; }
  .langues button[aria-pressed="true"] { background: var(--vert); color: #fff; font-weight: 600; }
  .compte { font-size: 14px; color: var(--doux); text-align: right; }
  .compte b { color: var(--texte); display: block; font-weight: 600; }
  button.lien { border: 0; background: none; color: var(--vert); font: inherit; font-size: 14px; cursor: pointer; padding: 4px 0; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .bloc { background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 18px; margin-bottom: 14px; }
  .etroit { max-width: 460px; margin: 28px auto; }
  h1 { font-size: 21px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.3px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .aide { color: var(--doux); font-size: 14px; margin: 0 0 14px; }
  label { display: block; font-size: 14px; color: var(--doux); margin: 12px 0 5px; }
  input, select, textarea { width: 100%; padding: 12px 13px; font: inherit; font-size: 16px; border: 1px solid var(--trait); border-radius: 10px; background: var(--fond); color: var(--texte); }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--vert); outline-offset: -1px; }
  input.code { font-size: 26px; letter-spacing: 8px; text-align: center; font-variant-numeric: tabular-nums; }
  .boutons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn { padding: 13px 18px; font: inherit; font-size: 16px; font-weight: 650; border-radius: 12px; cursor: pointer; border: 1px solid var(--trait); background: var(--carte); color: var(--texte); text-decoration: none; text-align: center; display: inline-block; }
  .btn.principal { border: 0; background: var(--vert); color: #fff; }
  .btn.plein { flex: 1 1 auto; }
  .btn:disabled { opacity: .55; cursor: default; }
  .apercu-bandeau { margin: 0 0 14px; padding: 12px 14px; border-radius: 10px; background: var(--ambre-pale); color: var(--ambre); border: 1px solid #f0d2a4; font-size: 15px; line-height: 1.45; }
  .apercu-bandeau b { color: #6b440b; }
  .alerte { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 15px; }
  .alerte.mauvais { background: var(--ambre-pale); color: #7a4a0e; }
  .alerte.bon { background: var(--vert-pale); color: #0a6136; }
  .message { text-align: center; padding: 56px 20px; color: var(--doux); }
  .message strong { display: block; color: var(--texte); font-size: 17px; margin-bottom: 6px; }

  .onglets { display: flex; gap: 6px; margin: 4px 0 14px; border-bottom: 1px solid var(--trait); }
  .onglets button { border: 0; background: none; font: inherit; font-size: 16px; padding: 10px 12px; color: var(--doux); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .onglets button[aria-selected="true"] { color: var(--texte); font-weight: 650; border-bottom-color: var(--vert); }
  .onglets .n { display: inline-block; min-width: 22px; padding: 0 6px; border-radius: 999px; background: var(--fond); font-size: 13px; margin-left: 4px; }
  .filtres { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .filtres input, .filtres select { padding: 10px 12px; font-size: 15px; background: var(--carte); }
  @media (max-width: 760px) { .filtres { grid-template-columns: 1fr 1fr; } .filtres input { grid-column: 1 / -1; } }
  .compteLigne { color: var(--doux); font-size: 14px; margin: -4px 0 12px; }
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .carte { background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0; font: inherit; color: inherit; }
  .carte:focus-visible { outline: 2px solid var(--vert); outline-offset: 2px; }
  .carte .photo { aspect-ratio: 16 / 10; background: linear-gradient(135deg, #1f2328, #008a44); position: relative; }
  .carte .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .carte .etat { position: absolute; top: 10px; left: 10px; }
  .carte .corps { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .carte .titre { font-weight: 700; font-size: 16px; }
  .carte .titre .annee { color: var(--vert); }
  .carte .sous { color: var(--doux); font-size: 14px; }
  .carte .bas { display: flex; justify-content: space-between; align-items: flex-end; margin-top: auto; padding-top: 8px; gap: 8px; }
  .carte .prix { font-size: 19px; font-weight: 800; color: var(--vert); white-space: nowrap; }
  .carte .conv { font-size: 13px; color: var(--doux); }
  .carte .lieu { font-size: 13px; color: var(--doux); text-align: right; }
  .puce { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--fond); color: var(--texte); }
  .puce.vert { background: var(--vert-pale); color: #0a6136; }
  .puce.ambre { background: var(--ambre-pale); color: #7a4a0e; }
  .puce.rouge { background: var(--rouge-pale); color: var(--rouge); }

  .offres { display: flex; flex-direction: column; gap: 10px; }
  .offre { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center; background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon); padding: 10px; }
  .offre img, .offre .vide { width: 84px; height: 56px; border-radius: 8px; object-fit: cover; background: linear-gradient(135deg, #1f2328, #008a44); display: block; }
  .offre .t { font-weight: 650; }
  .offre .d { color: var(--doux); font-size: 14px; }
  @media (max-width: 560px) { .offre { grid-template-columns: 64px 1fr; } .offre img, .offre .vide { width: 64px; height: 44px; } .offre .btn { grid-column: 1 / -1; } }

  /* Fiche d'un véhicule */
  .voile { position: fixed; inset: 0; background: rgba(15,18,22,.55); z-index: 40; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 24px 12px; }
  .fenetre { background: var(--fond); border-radius: 18px; max-width: 860px; width: 100%; padding: 16px; position: relative; }
  .fenetre .fermer { position: absolute; top: 10px; right: 10px; z-index: 3; width: 38px; height: 38px; border-radius: 999px; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 22px; cursor: pointer; }
  .hero { position: relative; aspect-ratio: 16 / 10; border-radius: var(--rayon); overflow: hidden; background: linear-gradient(135deg, #1f2328, #008a44); color: #fff; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .compteur { position: absolute; bottom: 10px; right: 12px; background: rgba(0,0,0,.55); padding: 3px 10px; border-radius: 999px; font-size: 13px; }
  .bande { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; }
  .bande img { width: 82px; height: 56px; object-fit: cover; border-radius: 8px; border: 2px solid transparent; cursor: pointer; flex: none; }
  .bande img[aria-current="true"] { border-color: var(--vert); }
  .ligne { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--trait); font-size: 15px; }
  .ligne:last-child { border-bottom: 0; }
  .ligne .k { color: var(--doux); }
  .ligne .v { font-weight: 600; text-align: right; }
  .ligne .v.prix { color: var(--vert); font-size: 20px; font-weight: 800; }
  .pastilles { display: flex; flex-wrap: wrap; gap: 6px; }
  .pastilles span { padding: 5px 10px; border-radius: 999px; background: var(--carte); border: 1px solid var(--trait); font-size: 13px; }
  .actionsFiche { position: sticky; bottom: 0; background: var(--fond); padding: 12px 0 2px; display: flex; flex-wrap: wrap; gap: 10px; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .duo { grid-template-columns: 1fr; } }
  footer { text-align: center; color: var(--doux); font-size: 13px; padding: 28px 16px 40px; }
  /* Véhicules GM (16 nov.) */
  .filtres.gmf { grid-template-columns: 2fr 1fr 1fr 1fr 1fr; }
  @media (max-width: 760px) { .filtres.gmf { grid-template-columns: 1fr 1fr; } }
  .hero .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 999px; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 26px; cursor: pointer; }
  .hero .nav.prec { left: 10px; } .hero .nav.suiv { right: 10px; }
  h3.region { font-size: 15px; margin: 14px 0 8px; color: var(--doux); font-weight: 650; }
  h3.region .n { display: inline-block; min-width: 22px; padding: 0 6px; border-radius: 999px; background: var(--fond); font-size: 12px; text-align: center; }
  .dommages { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .dommage { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; padding: 6px; border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); }
  .dommage .t { font-weight: 650; font-size: 14px; }
  .dommage .d { color: var(--doux); font-size: 13px; }
  .vignette { width: 72px; height: 54px; border-radius: 8px; overflow: hidden; border: 0; padding: 0; background: var(--fond); cursor: zoom-in; display: block; }
  .vignette img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vignette.vide { cursor: default; background: linear-gradient(135deg, #1f2328, #5f6978); }
  .agrandi { position: fixed; inset: 0; z-index: 60; background: rgba(10,12,15,.88); display: flex; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
  .agrandi img { max-width: 100%; max-height: 100%; border-radius: 10px; }
  .agrandi .fermer { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 999px; border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 24px; cursor: pointer; }

  @media (prefers-color-scheme: dark) {
    :root { --texte: #f2f3f5; --doux: #9aa1ab; --trait: #2a2d33; --fond: #121316; --carte: #1b1d21; --vert-pale: #12331f; --ambre-pale: #3a2415; --rouge-pale: #3a1714; }
    .alerte.mauvais, .puce.ambre { color: #f0b98b; }
    .alerte.bon, .puce.vert { color: #8fd9b0; }
  }
</style>
</head>
<body>

<header>
  <div class="rangee">
    <span class="marque" id="marque"></span>
    <div class="pousse">
      <div class="compte" id="compte" hidden></div>
      <div class="langues">
        <button type="button" data-langue="fr">FR</button>
        <button type="button" data-langue="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main id="main"></main>
<footer id="pied"></footer>

function idDrive(url) { const m = String(url || "").match(/\/d\/([^/?]+)/) || String(url || "").match(/[?&]id=([^&]+)/); return m ? m[1] : ""; }

function argent(n, devise) {
  const s = Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, langue === "en" ? "," : " ");

async function appelerApercu(corps) {

  const r = await fetch(SCRIPT_URL + "?" + q + "&jeton=" + encodeURIComponent(EQUIPE.jeton) + "&utilisateur=" + encodeURIComponent(EQUIPE.utilisateur) + "&_=" + Date.now(), { cache: "no-store" });

async function appeler(corps) {
  if (APERCU) return appelerApercu(corps);
  const r = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ langue: langue }, corps)) });
  const j = await r.json();
  if (j && j.ok === false && (j.code === "SESSION" || j.code === "SUSPENDU" || j.code === "EN_ATTENTE" || j.code === "NON_INSCRIT")) {
    ecrireSession(null); donnees = null; connexion.etape = "courriel"; connexion.erreur = j.erreur || ""; dessiner();

function brancherConnexion() {
  const c = connexion;
  if (c.etape === "courriel") {
    const champ = document.getElementById("courriel");
    const demander = async canal => {
      c.courriel = champ.value.trim().toLowerCase(); c.erreur = "";
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.courriel)) { champ.focus(); champ.style.borderColor = "var(--rouge)"; return; }
      document.querySelectorAll("#main button").forEach(b => b.disabled = true);
      try {
        const j = await appeler({ action: "acheteurCode", courriel: c.courriel, canal: canal });
        if (!j.ok) { c.erreur = j.erreur || t().RESEAU; }
        else { c.etape = "code"; c.canal = j.canal; c.destination = j.destination; c.textoPossible = j.textoPossible; c.message = j.message || ""; }
      } catch (e) { if (!e.session) c.erreur = t().RESEAU; }
      dessiner();
    };
    document.getElementById("parCourriel").onclick = () => demander("courriel");
    document.getElementById("parTexto").onclick = () => demander("texto");
    champ.addEventListener("keydown", e => { if (e.key === "Enter") demander("courriel"); });
    champ.focus();
  } else {
    const champ = document.getElementById("code");
    const entrer = async () => {
      const code = champ.value.replace(/\D/g, "");
      if (code.length !== 6) { champ.focus(); return; }
      document.querySelectorAll("#main button").forEach(b => b.disabled = true);
      try {
        const j = await appeler({ action: "acheteurConnexion", courriel: c.courriel, code: code });
        if (!j.ok) { c.erreur = j.erreur || t().RESEAU; dessiner(); return; }
        ecrireSession({ cle: j.cleAcheteur, courriel: c.courriel, nom: (j.acheteur && (j.acheteur.nomLegal || j.acheteur.signataire)) || c.courriel, expire: j.expire });
        if (j.acheteur && j.acheteur.langue && !params.get("lang")) { langue = j.acheteur.langue; try { localStorage.setItem("automaxLangue", langue); } catch (e) {} }
        c.erreur = ""; c.etape = "courriel"; donnees = null; dessiner(); charger();
      } catch (e) { if (!e.session) { c.erreur = t().RESEAU; dessiner(); } }
    };
    document.getElementById("entrer").onclick = entrer;
    champ.addEventListener("input", () => { if (champ.value.replace(/\D/g, "").length === 6) entrer(); });
    champ.addEventListener("keydown", e => { if (e.key === "Enter") entrer(); });
    document.getElementById("renvoyer").onclick = async () => {
      c.erreur = "";
      try { const j = await appeler({ action: "acheteurCode", courriel: c.courriel, canal: c.canal }); if (!j.ok) c.erreur = j.erreur; else { c.destination = j.destination; c.canal = j.canal; c.message = j.message || ""; } } catch (e) { if (!e.session) c.erreur = t().RESEAU; }
      dessiner();
    };
    document.getElementById("changer").onclick = () => { c.etape = "courriel"; c.erreur = ""; c.message = ""; dessiner(); };
    champ.focus();
  }
}

function filtrer() {
  const q = filtres.q.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  let l = donnees.vehicules.filter(v => {
    if (filtres.marque && (v.marque || titres(v).haut.split(" ")[0]) !== filtres.marque) return false;
    if (filtres.annee && String(v.annee || titres(v).annee) !== filtres.annee) return false;
    if (!q) return true;
    const texte = [v.annee, v.marque, v.modele, v.version, v.model, v.vin, v.couleur, v.vendeur && v.vendeur.ville].join(" ").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    return q.split(/\s+/).every(m => texte.indexOf(m) >= 0);
  });
  const prix = v => nombre(v.price) || (filtres.tri === "prixMoins" ? Infinity : 0);
  if (filtres.tri === "prixMoins") l.sort((a, b) => prix(a) - prix(b));
  else if (filtres.tri === "prixPlus") l.sort((a, b) => prix(b) - prix(a));
  else if (filtres.tri === "annee") l.sort((a, b) => Number(b.annee || 0) - Number(a.annee || 0));
  else l.sort((a, b) => String(b.listedOn || "").localeCompare(String(a.listedOn || "")));
  return l;
}

async function ouvrirFiche(vin) {
  const base = donnees.vehicules.find(v => v.vin === vin) || { vin: vin };
  fiche = { vin: vin, vehicule: base, etat: base, photo: 0, chargee: false };
  dessinerFiche();
  try {
    const j = await appeler({ action: "acheteurVehicule", cleAcheteur: session.cle, vin: vin });
    if (!fiche || fiche.vin !== vin) return;
    if (!j.ok) { fiche.erreur = j.erreur || t().RESEAU; dessinerFiche(); return; }
    fiche.vehicule = Object.assign({}, base, j.vehicule || {});
    fiche.etat = { votreOffre: j.votreOffre, enCours: j.enCours, reserve: j.reserve };
    fiche.chargee = true;
    dessinerFiche();
  } catch (e) { if (!e.session && fiche) { fiche.erreur = t().RESEAU; dessinerFiche(); } }
}

  if (fiche.erreur) h += '<div class="alerte mauvais" role="alert">' + echappe(fiche.erreur) + "</div>";

  else if (!e.reserve) {

/* ------------------------- Véhicules GM (16 nov.) ------------------------- */
/* Véhicules de fin de location GM que la concession peut acheter pour l'acheteur (GM Financial DealerSource, PortailGmf.gs).
   AUCUN PRIX : l'acheteur voit toutes les photos, les dommages, les pneus, la cote, et fait une offre en $ CA. */
function karImg(u, taille) {
  const s = String(u || "");
  if (!/kar-media\.com|autc\.com/.test(s)) return s;
  const base = s.replace(/_(th|dt)(\.jpg)/i, "$2");
  return taille ? base.replace(/(\.jpg)(?!.*\.jpg)/i, "_" + taille + "$1") : base;
}
function casse(s) {
  s = String(s || "").trim();
  if (!s || s !== s.toUpperCase()) return s;
  return s.split(/(\s+|-|\/)/).map(m => (!/^[A-ZÀ-Ü]+$/.test(m) || m.length <= 3) ? m : m.charAt(0) + m.slice(1).toLowerCase()).join("");
}
function descDommage(d) { return String(d || "").replace(/(\d+)\s*X\s*(\d+(?:\.\d+)?)"?/gi, (m, n, l) => n + " × " + String(Math.round(parseFloat(l) * 10) / 10).replace(".", langue === "en" ? "." : ",") + (langue === "en" ? " in" : " po")).trim(); }
function dateFin(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  return d.toLocaleString(langue === "en" ? "en-CA" : "fr-CA", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
}
function finProche(iso) { const t = new Date(iso).getTime(); return isFinite(t) && t - Date.now() < 24 * 3600000; }
function gmfTitres(v) { return { annee: v.annee ? String(v.annee) : "", haut: [v.marque, v.modele].filter(Boolean).join(" "), bas: v.version || "" }; }
function gmfNom(v) { const x = gmfTitres(v); return [x.annee, x.haut, x.bas].filter(Boolean).join(" "); }
function sansAccent(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

function filtrerGmf() {
  const f = filtresGmf, q = sansAccent(f.q.trim());
  let l = (gmf.vehicules || []).filter(v => {
    if (f.marque && v.marque !== f.marque) return false;
    if (f.modele && v.modele !== f.modele) return false;
    if (f.annee && String(v.annee) !== f.annee) return false;
    if (!q) return true;
    const texte = sansAccent([v.annee, v.marque, v.modele, v.version, v.vin, v.couleur, v.carrosserie, v.motricite, v.ville, v.province].join(" "));
    return q.split(/\s+/).every(m => texte.indexOf(m) >= 0);
  });
  if (f.tri === "annee") l.sort((a, b) => Number(b.annee || 0) - Number(a.annee || 0));
  else if (f.tri === "km") l.sort((a, b) => (Number(a.km) || 9e9) - (Number(b.km) || 9e9));
  else l.sort((a, b) => (new Date(a.finVente).getTime() || 9e15) - (new Date(b.finVente).getTime() || 9e15));
  return l;
}

function vueGmf() {
  const g = t().gmf, tous = gmf.vehicules || [];
  let h = '<p class="aide" style="margin:0 0 12px">' + echappe(g.intro) + "</p>";
  if (!tous.length) return h + '<div class="message"><strong>' + echappe(g.aucun) + "</strong></div>";
  const f = filtresGmf;
  const marques = Array.from(new Set(tous.map(v => v.marque).filter(Boolean))).sort();
  const modeles = Array.from(new Set(tous.filter(v => !f.marque || v.marque === f.marque).map(v => v.modele).filter(Boolean))).sort();
  const annees = Array.from(new Set(tous.map(v => String(v.annee || "")).filter(Boolean))).sort().reverse();
  h += '<div class="filtres gmf">' +
    '<input id="qGmf" type="search" placeholder="' + echappe(g.recherche) + '" value="' + echappe(f.q) + '" aria-label="' + echappe(g.recherche) + '">' +
    '<select id="gMarque" aria-label="' + echappe(t().marque) + '"><option value="">' + echappe(t().toutesMarques) + "</option>" + marques.map(m => '<option' + (m === f.marque ? " selected" : "") + ">" + echappe(m) + "</option>").join("") + "</select>" +
    '<select id="gModele" aria-label="' + echappe(t().modele) + '"><option value="">' + echappe(g.tousModeles) + "</option>" + modeles.map(m => '<option' + (m === f.modele ? " selected" : "") + ">" + echappe(m) + "</option>").join("") + "</select>" +
    '<select id="gAnnee" aria-label="' + echappe(t().annee) + '"><option value="">' + echappe(t().toutesAnnees) + "</option>" + annees.map(a => '<option' + (a === f.annee ? " selected" : "") + ">" + echappe(a) + "</option>").join("") + "</select>" +
    '<select id="gTri" aria-label="Tri">' + Object.keys(g.tri).map(k => '<option value="' + k + '"' + (k === f.tri ? " selected" : "") + ">" + echappe(g.tri[k]) + "</option>").join("") + "</select></div>";
  return h + '<div id="resultatsGmf"></div>';
}

function dessinerResultatsGmf() {
  const g = t().gmf, l = filtrerGmf(), zone = document.getElementById("resultatsGmf");
  if (!zone) return;
  let h = '<p class="compteLigne">' + echappe(g.n(l.length)) + "</p>";
  if (!l.length) { zone.innerHTML = h + '<div class="message"><strong>' + echappe(t().aucunFiltre) + "</strong></div>"; return; }
  h += '<div class="grille">' + l.map(v => {
    const x = gmfTitres(v), proche = finProche(v.finVente);
    const etat = v.votreOffre ? '<span class="puce vert">' + echappe(g.votreOffre(argent(v.votreOffre.prix))) + "</span>" : "";
    const infos = [v.nbPhotos ? g.nPhotos(v.nbPhotos) : "", v.nbDommages ? g.nDommages(v.nbDommages) : (v.ficheLue ? g.aucunDommage : "")].filter(Boolean).join(" · ");
    return '<button type="button" class="carte" data-gmf="' + echappe(v.vin) + '">' +

      '<div class="sous">' + echappe([x.bas, kmLisible(v.km)].filter(Boolean).join(" · ")) + "</div>" +
      (infos ? '<div class="sous">' + echappe(infos) + "</div>" : "") +
      '<div class="bas"><div>' + (v.cote ? '<span class="puce" style="white-space:nowrap">' + echappe(g.cote(v.cote)) + "</span>" : "") + "</div>" +
      '<div class="lieu">' + echappe([v.ville, v.province].filter(Boolean).join(", ")) + (v.finVente ? '<br><span style="' + (proche ? "color:var(--ambre);font-weight:600" : "") + '">' + echappe(g.fin(dateFin(v.finVente))) + "</span>" : "") + "</div></div></div></button>";
  }).join("") + "</div>";
  zone.innerHTML = h;

function brancherGmf() {
  const q = document.getElementById("qGmf");
  if (!q) return;
  q.addEventListener("input", () => { filtresGmf.q = q.value; dessinerResultatsGmf(); });
  document.getElementById("gMarque").onchange = e => { filtresGmf.marque = e.target.value; filtresGmf.modele = ""; dessiner(); };
  document.getElementById("gModele").onchange = e => { filtresGmf.modele = e.target.value; dessinerResultatsGmf(); };
  document.getElementById("gAnnee").onchange = e => { filtresGmf.annee = e.target.value; dessinerResultatsGmf(); };
  document.getElementById("gTri").onchange = e => { filtresGmf.tri = e.target.value; dessinerResultatsGmf(); };
  dessinerResultatsGmf();
}

function offresGmfHtml() {
  const g = t().gmf, l = (gmf && gmf.offres) || [];
  if (!l.length) return "";
  return '<h2 style="margin:18px 0 10px">' + echappe(g.mesOffres) + '</h2><div class="offres">' + l.map(o => {
    const ton = o.statut === "contrat" ? "vert" : (o.statut === "refusee" || o.statut === "expiree" ? "rouge" : "ambre");
    const date = (o.maj || o.creeLe) ? new Date(o.maj || o.creeLe).toLocaleDateString(langue === "en" ? "en-CA" : "fr-CA", { day: "numeric", month: "short", year: "numeric" }) : "";
    const v = (gmf.vehicules || []).find(x => x.vin === o.vin);
    const bouton = o.lien ? '<a class="btn principal" href="' + echappe(o.lien) + '" target="_blank" rel="noopener">' + echappe(t().ouvrir) + "</a>"
      : (v ? '<button type="button" class="btn" data-gmf-offre="' + echappe(o.vin) + '">' + echappe(t().ouvrir) + "</button>" : "");
    return '<div class="offre">' + (v && v.photo ? '<img alt="" loading="lazy" src="' + echappe(karImg(v.photo, "th")) + '">' : '<span class="vide"></span>') +
      '<div><div class="t">' + echappe(o.titre || o.vin) + ' <span class="puce ' + ton + '">' + echappe(g.statuts[o.statut] || o.statut) + "</span></div>" +
      '<div class="d">' + echappe(t().offrePrix(argent(nombre(o.prix)))) + "</div>" +
      '<div class="d">' + echappe(date) + "</div></div>" + bouton + "</div>";
  }).join("") + "</div>";
}

async function ouvrirFicheGmf(vin) {
  const base = ((gmf && gmf.vehicules) || []).find(v => v.vin === vin) || { vin: vin };
  fiche = { gmf: true, vin: vin, vehicule: base, photo: 0, chargee: false };
  dessinerFiche();
  try {
    const j = await appeler({ action: "acheteurVehiculeGmf", cleAcheteur: session.cle, vin: vin });
    if (!fiche || fiche.vin !== vin) return;
    if (!j.ok) { fiche.erreur = j.erreur || t().RESEAU; dessinerFiche(); return; }
    fiche.vehicule = Object.assign({}, base, j.vehicule || {});
    fiche.votreOffre = j.votreOffre || null;
    fiche.chargee = true;
    dessinerFiche();
  } catch (e) { if (!e.session && fiche) { fiche.erreur = t().RESEAU; dessinerFiche(); } }
}

function dessinerFicheGmf(voile) {
  const g = t().gmf, v = fiche.vehicule, photos = (v.photos && v.photos.length ? v.photos : (v.photo ? [v.photo] : []));
  if (fiche.photo >= photos.length) fiche.photo = 0;
  let h = '<div class="fenetre" role="dialog" aria-modal="true" aria-label="' + echappe(gmfNom(v)) + '"><button type="button" class="fermer" id="fermer" aria-label="' + echappe(t().fermer) + '">×</button>';
  h += '<div class="hero">' + (photos.length ? '<img alt="" src="' + echappe(karImg(photos[fiche.photo])) + '">' : "") + (photos.length > 1 ? '<div class="compteur">' + (fiche.photo + 1) + " / " + photos.length + "</div>" : "") +
    (photos.length > 1 ? '<button type="button" class="nav prec" id="photoPrec" aria-label="‹">‹</button><button type="button" class="nav suiv" id="photoSuiv" aria-label="›">›</button>' : "") + "</div>";
  if (photos.length > 1) h += '<div class="bande">' + photos.map((p, i) => '<img alt="" loading="lazy" data-i="' + i + '" src="' + echappe(karImg(p, "th")) + '"' + (i === fiche.photo ? ' aria-current="true"' : "") + ">").join("") + "</div>";
  h += '<div class="bloc" style="margin-top:12px"><h1>' + echappe(gmfNom(v)) + "</h1>";
  h += '<p class="aide" style="margin:0 0 6px">' + echappe(g.sansPrix) + "</p>";
  if (fiche.votreOffre) h += '<div><span class="puce vert">' + echappe(g.votreOffre(argent(fiche.votreOffre.prix))) + "</span></div>";
  const lignes = [[t().km, kmLisible(v.km) || t().kmInconnu], [g.coteTitre, v.cote ? g.cote(v.cote) : ""], [t().couleur, [v.couleur, v.couleurInt ? g.interieur(v.couleurInt) : ""].filter(Boolean).join(" · ")],
    [g.lieu, [v.ville, v.province].filter(Boolean).join(", ")], [g.finTitre, dateFin(v.finVente)], [t().vin, v.vin]].filter(l => l[1]);
  h += lignes.map(l => '<div class="ligne"><span class="k">' + echappe(l[0]) + '</span><span class="v"' + (l[0] === t().vin ? ' style="font-family:ui-monospace,Menlo,monospace"' : "") + ">" + echappe(l[1]) + "</span></div>").join("") + "</div>";
  const det = [[t().version, v.version], [t().carrosserie, casse(v.carrosserie)], [t().moteur, casse(v.moteur)], [t().carburant, casse(v.carburant)], [t().transmission, casse(v.transmission)], [t().motricite, casse(v.motricite)], [t().portes, v.portes], [g.cles, v.cles], [g.typeInv, v.typeInv]].filter(l => l[1]);
  const pneus = v.pneus || [];
  if (det.length || pneus.length) {
    h += '<div class="duo">';
    if (det.length) h += '<div class="bloc"><h2>' + echappe(t().details) + "</h2>" + det.map(l => '<div class="ligne"><span class="k">' + echappe(l[0]) + '</span><span class="v">' + echappe(l[1]) + "</span></div>").join("") + "</div>";
    if (pneus.length) h += '<div class="bloc"><h2>' + echappe(g.pneus) + "</h2>" + pneus.map(p => '<div class="ligne"><span class="k">' + echappe(casse(p.n)) + '</span><span class="v">' + echappe([p.p, casse(p.e), p.t, p.h ? g.hiver : ""].filter(Boolean).join(" · ")) + "</span></div>").join("") + "</div>";
    h += "</div>";
  }
  const dommages = v.dommages || [];
  h += '<div class="bloc"><h2>' + echappe(g.dommagesTitre(dommages.length)) + "</h2>";
  if (!fiche.chargee) h += '<p class="aide">' + echappe(t().chargement) + "</p>";
  else if (!dommages.length) h += '<p class="aide">' + echappe(v.ficheLue === false ? g.ficheAVenir : g.aucunDommageLong) + "</p>";
  else {
    const regions = {};
    dommages.forEach(d => { (regions[d.r || "—"] = regions[d.r || "—"] || []).push(d); });
    Object.keys(regions).forEach(r => {
      h += '<h3 class="region">' + echappe(r) + ' <span class="n">' + regions[r].length + "</span></h3>";
      h += '<div class="dommages">' + regions[r].map(d => '<div class="dommage">' +
        (d.i ? '<button type="button" class="vignette" data-photo="' + echappe(karImg(d.i)) + '"><img alt="" loading="lazy" src="' + echappe(karImg(d.i, "th")) + '"></button>' : '<span class="vignette vide"></span>') +
        '<div><div class="t">' + echappe(casse(d.p)) + "</div><div class=\"d\">" + echappe([casse(d.t), descDommage(d.d)].filter(Boolean).join(" — ")) + "</div></div></div>").join("") + "</div>";
    });
  }
  h += "</div>";
  if ((v.annonces || []).length) h += '<div class="bloc"><h2>' + echappe(g.annonces) + "</h2>" + v.annonces.map(a => '<div class="ligne"><span class="k">' + echappe(a) + "</span></div>").join("") + "</div>";
  if (fiche.erreur) h += '<div class="alerte mauvais" role="alert">' + echappe(fiche.erreur) + "</div>";
  h += APERCU ? '<div class="actionsFiche"><button type="button" class="btn plein" disabled>' + echappe(ta().offre) + "</button></div></div>"
    : '<div class="actionsFiche"><button type="button" class="btn principal plein" id="offrirGmf"' + (fiche.chargee ? "" : " disabled") + ">" + echappe(fiche.votreOffre ? g.modifierOffre : t().faireOffre) + "</button></div></div>";
  voile.innerHTML = h;
  document.getElementById("fermer").onclick = fermerFiche;
  voile.querySelectorAll(".bande img").forEach(img => img.onclick = () => { fiche.photo = Number(img.dataset.i); dessinerFiche(); });
  const pp = document.getElementById("photoPrec"), ps = document.getElementById("photoSuiv");
  if (pp) pp.onclick = () => { fiche.photo = (fiche.photo - 1 + photos.length) % photos.length; dessinerFiche(); };
  if (ps) ps.onclick = () => { fiche.photo = (fiche.photo + 1) % photos.length; dessinerFiche(); };
  voile.querySelectorAll("[data-photo]").forEach(b => b.onclick = () => agrandir(b.dataset.photo));
  const o = document.getElementById("offrirGmf"); if (o) o.onclick = offreGmf;
}

function agrandir(url) {
  const z = document.createElement("div");
  z.className = "agrandi"; z.innerHTML = '<img alt="" src="' + echappe(url) + '"><button type="button" class="fermer" aria-label="' + echappe(t().fermer) + '">×</button>';
  z.onclick = () => z.remove();
  document.body.appendChild(z);
}

function offreGmf() {
  const g = t().gmf, v = fiche.vehicule;
  const fen = document.querySelector("#voile .fenetre");
  const zone = document.createElement("div");
  zone.className = "bloc";
  zone.innerHTML = "<h2>" + echappe(t().offreTitre) + '</h2><p class="aide">' + echappe(g.offreTexte(dateFin(v.finVente))) + "</p>" +
    '<label for="prixOffre">' + echappe(t().votrePrix) + '</label><input id="prixOffre" type="text" inputmode="numeric" autocomplete="off" value="' + (fiche.votreOffre ? echappe(fiche.votreOffre.prix) : "") + '">' +
    '<label for="noteOffre">' + echappe(t().note) + '</label><textarea id="noteOffre" maxlength="500" placeholder="' + echappe(t().notePlaceholder) + '">' + echappe((fiche.votreOffre && fiche.votreOffre.note) || "") + "</textarea>" +
    '<div id="erreurOffre"></div><div class="boutons"><button type="button" class="btn principal plein" id="envoyer">' + echappe(t().envoyerOffre) + '</button><button type="button" class="btn" id="annulerOffre">' + echappe(t().annuler) + "</button></div>";
  fen.querySelector(".actionsFiche").replaceWith(zone);
  zone.scrollIntoView({ behavior: "smooth", block: "center" });
  const champ = document.getElementById("prixOffre"); champ.focus();
  document.getElementById("annulerOffre").onclick = dessinerFiche;
  document.getElementById("envoyer").onclick = async () => {
    const err = document.getElementById("erreurOffre"); err.innerHTML = "";
    const p = nombre(champ.value);
    if (!(p >= 500)) { champ.focus(); champ.style.borderColor = "var(--rouge)"; return; }
    const b = document.getElementById("envoyer"); b.disabled = true; b.textContent = t().envoi;
    try {
      const j = await appeler({ action: "acheteurOffreGmf", cleAcheteur: session.cle, vin: v.vin, prix: Math.round(p), note: document.getElementById("noteOffre").value.trim() });
      if (!j.ok) { b.disabled = false; b.textContent = t().envoyerOffre; err.innerHTML = '<div class="alerte mauvais" role="alert">' + echappe(j.erreur || t().RESEAU) + "</div>"; return; }
      fiche.votreOffre = { id: j.id, prix: j.prix, note: document.getElementById("noteOffre").value.trim() };
      zone.innerHTML = "<h2>" + echappe(j.maj ? g.merciModif : t().merciOffre) + '</h2><p class="aide">' + echappe(g.merciTexte(dateFin(j.finVente || v.finVente))) + '</p><div class="boutons"><button type="button" class="btn principal plein" id="finFiche">' + echappe(t().fermer) + "</button></div>";
      document.getElementById("finFiche").onclick = fermerFiche;
      chargerGmf();
    } catch (e) { if (!e.session) { b.disabled = false; b.textContent = t().envoyerOffre; err.innerHTML = '<div class="alerte mauvais">' + echappe(t().RESEAU) + "</div>"; } }
  };
}

async function chargerGmf() {
  if (!session) return;
  try {
    const j = await appeler({ action: "acheteurGmf", cleAcheteur: session.cle });
    gmf = (j && j.ok && Array.isArray(j.vehicules)) ? j : null;
    apercuErreur = gmf ? "" : ((j && j.erreur) || t().RESEAU);
  } catch (e) { if (!e.session) { gmf = gmf || null; apercuErreur = gmf ? "" : t().RESEAU; } }
  if (fiche) { redessinerApres = true; return; }
  if (donnees || APERCU) {
    const q = document.getElementById("qGmf"), garde = q && document.activeElement === q;
    dessiner();
    if (garde) { const n = document.getElementById("qGmf"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  }
}

/* ------------------------------- Données -------------------------------- */
async function charger() {
  if (APERCU) {
    dessiner();
    if (!session) return;
    await chargerGmf();
    const vinA = (params.get("vin") || "").trim().toUpperCase();
    if (vinA && !charger.vinOuvert) { charger.vinOuvert = true; ouvrirFicheGmf(vinA); }
    return;
  }
  if (!session) { dessiner(); return; }
  chargerGmf();
  try {
    const j = await appeler({ action: "acheteurPortail", cleAcheteur: session.cle });
    if (!j.ok) { if (!donnees) document.getElementById("main").innerHTML = '<div class="message"><strong>' + echappe(j.erreur || t().RESEAU) + "</strong></div>"; return; }
    donnees = j;
    if (j.acheteur) { session.nom = j.acheteur.nomLegal || session.nom; ecrireSession(session); }
    const q = document.getElementById("q"), garde = q && document.activeElement === q;
    dessiner();
    if (garde) { const n = document.getElementById("q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  } catch (e) { if (!e.session && !donnees) document.getElementById("main").innerHTML = '<div class="message"><strong>' + echappe(t().RESEAU) + "</strong></div>"; }
}

async function deconnecter() {
  const cle = session && session.cle;
  ecrireSession(null); donnees = null; gmf = null; fermerFiche(); connexion.etape = "courriel"; connexion.erreur = ""; dessiner();
  if (cle) { try { await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "acheteurDeconnexion", cleAcheteur: cle }) }); } catch (e) {} }
}

document.querySelectorAll(".langues button").forEach(b => b.addEventListener("click", () => {
  langue = b.dataset.langue; try { localStorage.setItem("automaxLangue", langue); } catch (e) {}
  dessiner(); if (fiche) dessinerFiche();
}));
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; const a = document.querySelector(".agrandi"); if (a) { a.remove(); return; } if (fiche) fermerFiche(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && session && donnees && !fiche) charger(); });
dessiner();
charger();
</script>
</body>
</html>
