<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Véhicule à vendre</title>
<style>
  :root {
    --vert: #008a44;
    --texte: #16181c;
    --doux: #6b7280;
    --trait: #e6e8ec;
    --fond: #f6f7f9;
    --carte: #ffffff;
    --rayon: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fond); color: var(--texte); line-height: 1.45;
  }
  header {
    background: var(--carte); border-bottom: 1px solid var(--trait);
    padding: 14px 16px; position: sticky; top: 0; z-index: 10;
  }
  .rangee { display: flex; align-items: center; gap: 12px; max-width: 900px; margin: 0 auto; }
  .retour { text-decoration: none; color: var(--doux); font-size: 15px; }
  .retour:hover { color: var(--texte); }
  .pousse { margin-left: auto; }
  .langues { display: flex; border: 1px solid var(--trait); border-radius: 999px; overflow: hidden; }
  .langues button {
    border: 0; background: transparent; padding: 6px 12px;
    font: inherit; font-size: 13px; color: var(--doux); cursor: pointer;
  }
  .langues button[aria-pressed="true"] { background: var(--vert); color: #fff; font-weight: 600; }

  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .bloc {
    background: var(--carte); border: 1px solid var(--trait);
    border-radius: var(--rayon); padding: 18px; margin-bottom: 14px;
  }
  .bloc.serre { padding: 10px 18px; }

  /* ---- En-tête photo, à la manière d'une fiche d'encan ---- */
  .hero {
    position: relative; aspect-ratio: 16 / 10; border-radius: var(--rayon);
    overflow: hidden; background: #1f2328; color: #fff;
  }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero.sansPhoto { aspect-ratio: auto; min-height: 150px; background: linear-gradient(135deg, #1f2328, #008a44); }
  .hero .voile {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 32%, rgba(0,0,0,0) 62%, rgba(0,0,0,.62) 100%);
  }
  .hero .coin { position: absolute; padding: 14px 16px; max-width: 70%; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .hero .hg { top: 0; left: 0; }
  .hero .hd { top: 0; right: 0; text-align: right; max-width: 45%; }
  .hero .bg { bottom: 0; left: 0; }
  .hero .bd { bottom: 0; right: 0; text-align: right; }
  .hero .titre { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.15; }
  .hero .titre .annee { color: #8fe0b4; }
  .hero .sous { font-size: 14px; opacity: .95; margin-top: 2px; }
  .hero .lieu { font-size: 14px; font-weight: 600; }
  .hero .vendeurNom { font-size: 13px; opacity: .95; }
  .hero .km { font-size: 20px; font-weight: 800; }
  .hero .vin { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; opacity: .92; }
  .hero .compteur {
    position: absolute; right: 14px; bottom: 56px; font-size: 12px; font-weight: 600;
    background: rgba(0,0,0,.45); padding: 3px 9px; border-radius: 999px;
  }
  @media (max-width: 520px) {
    .hero .titre { font-size: 18px; }
    .hero .km { font-size: 17px; }
    .hero .coin { padding: 11px 12px; }
  }
  .bande { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: thin; }
  .bande img {
    width: 78px; height: 58px; object-fit: cover; border-radius: 8px;
    border: 2px solid transparent; cursor: pointer; flex: 0 0 auto; background: #e9ebef;
  }
  .bande img[aria-current="true"] { border-color: var(--vert); }

  /* ---- Lignes clés (prix, km, couleur) ---- */
  .ligne { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--trait); font-size: 15px; }
  .ligne:last-child { border-bottom: 0; }
  .ligne .k { color: var(--doux); }
  .ligne .v { font-weight: 600; text-align: right; }
  .ligne .v.prix { color: var(--vert); font-size: 20px; font-weight: 800; }

  h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.3px; }
  .vinTexte { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; color: var(--doux); }
  .description { white-space: pre-wrap; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .aide { color: var(--doux); font-size: 14px; margin: 0 0 16px; }
  .note { color: var(--doux); font-size: 13px; margin: 10px 0 0; }

  /* ---- Options et détails ---- */
  .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .options span {
    font-size: 14px; padding: 7px 12px; border-radius: 999px;
    background: var(--fond); border: 1px solid var(--trait);
  }
  .details { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
  .details .ligne { font-size: 14px; }
  @media (max-width: 520px) { .details { grid-template-columns: 1fr; } }

  /* ---- Window sticker (étiquette du fabricant) ---- */
  .bouton-pdf {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-top: 10px;
    border: 1px solid var(--trait); border-radius: 12px; background: var(--fond);
    color: var(--texte); text-decoration: none; font-weight: 600; font-size: 15px;
  }
  .bouton-pdf:hover { border-color: var(--vert); }
  .bouton-pdf svg { width: 26px; height: 26px; flex: 0 0 auto; color: #c62828; }
  .bouton-pdf .fleche { margin-left: auto; color: var(--doux); font-weight: 400; }
  .apercu iframe { width: 100%; height: 440px; border: 0; border-radius: 12px; background: #e9ebef; }
  .video-cadre { position: relative; aspect-ratio: 16 / 9; border-radius: var(--rayon); overflow: hidden; background: #000; }
  .video-cadre iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-lien { display: inline-block; margin-top: 10px; font-size: 14px; color: var(--vert); font-weight: 600; text-decoration: none; }

  label { display: block; font-size: 14px; color: var(--doux); margin: 12px 0 5px; }
  input, textarea {
    width: 100%; padding: 12px 13px; font: inherit; font-size: 16px;
    border: 1px solid var(--trait); border-radius: 10px;
    background: var(--fond); color: var(--texte);
  }
  input:focus, textarea:focus { outline: 2px solid var(--vert); outline-offset: -1px; }
  textarea { min-height: 84px; resize: vertical; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .duo { grid-template-columns: 1fr; gap: 0; } }

  button.envoyer {
    width: 100%; margin-top: 18px; padding: 15px; font: inherit; font-size: 17px;
    font-weight: 650; color: #fff; background: var(--vert);
    border: 0; border-radius: 12px; cursor: pointer;
  }
  button.envoyer:disabled { opacity: .55; cursor: default; }

  .alerte { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 15px; }
  .alerte.mauvais { background: #fdf0e8; color: #8a4b1d; }
  .alerte.bon { background: #e7f5ed; color: #0a6136; }
  .message { text-align: center; padding: 56px 20px; color: var(--doux); }
  .message strong { display: block; color: var(--texte); font-size: 17px; margin-bottom: 6px; }
  footer { text-align: center; color: var(--doux); font-size: 13px; padding: 28px 16px 40px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --texte: #f2f3f5; --doux: #9aa1ab; --trait: #2a2d33;
      --fond: #121316; --carte: #1b1d21;
    }
    .bande img { background: #24272c; }
    .alerte.mauvais { background: #3a2415; color: #f0b98b; }
    .alerte.bon { background: #12331f; color: #8fd9b0; }
  }
</style>

<header>

    <div class="bloc serre" id="blocCles"></div>

    <div class="bloc" id="blocSticker" hidden>

      <p class="aide" id="aideSticker" style="margin-bottom:0"></p>
      <div class="apercu" id="stickerApercu"></div>
      <a class="bouton-pdf" id="stickerLien" href="#" target="_blank" rel="noopener"></a>
      <p class="note" id="noteSticker"></p>
    </div>

    <div class="bloc" id="blocCarfax" hidden>
      <h2 id="titreCarfax"></h2>
      <p class="aide" id="aideCarfax" style="margin-bottom:0"></p>
      <a class="bouton-pdf" id="carfaxLien" href="#" target="_blank" rel="noopener"></a>
    </div>

    <div class="bloc" id="blocOptions" hidden>
      <h2 id="titreOptions"></h2>
      <div class="options" id="options"></div>
    </div>

    <div class="bloc" id="blocDetails" hidden>
      <h2 id="titreDetails"></h2>
      <div class="details" id="details"></div>
      <p class="note" id="noteDetails"></p>
    </div>

    <div class="bloc" id="blocVideo" hidden>
      <h2 id="titreVideo"></h2>
      <div class="video-cadre" id="videoCadre"></div>
      <a class="video-lien" id="videoLien" href="#" target="_blank" rel="noopener"></a>
    </div>

    <div class="bloc" id="blocDescription" hidden>
      <h2 id="titreDescription"></h2>
      <div class="description" id="description"></div>
    </div>

    <div class="bloc" id="blocVendeur" hidden>
      <h2 id="titreVendeur"></h2>
      <div id="vendeur"></div>
    </div>

    <div class="bloc" id="blocOffre">
      <h2 id="titreOffre"></h2>
      <p class="aide" id="aideOffre"></p>
      <form id="formulaire" novalidate>
        <div class="duo">
          <div><label for="nom"></label><input id="nom" name="nom" autocomplete="name" required></div>
          <div><label for="entreprise"></label><input id="entreprise" name="entreprise" autocomplete="organization"></div>
        </div>
        <div class="duo">
          <div><label for="courriel"></label><input id="courriel" name="courriel" type="email" autocomplete="email" inputmode="email" required></div>
          <div><label for="telephone"></label><input id="telephone" name="telephone" type="tel" autocomplete="tel" inputmode="tel"></div>
        </div>
        <label for="prix"></label>
        <input id="prix" name="prix" inputmode="decimal" required>
        <label for="conditions"></label>
        <textarea id="conditions" name="conditions"></textarea>
        <button class="envoyer" id="envoyer" type="submit"></button>
      </form>
      <div class="alerte mauvais" id="erreur" hidden></div>
    </div>
  </div>

  <div class="message" id="message"></div>
</main>

<footer id="pied"></footer>

function langueChoisie() {
  try {
    const g = localStorage.getItem("automaxLangue");
    if (g === "fr" || g === "en") return g;
  } catch (e) {}
  return (navigator.language || "fr").toLowerCase().indexOf("en") === 0 ? "en" : "fr";
}

let langue = langueChoisie();
let vehicule = null;
let photoCourante = 0;
function t() { return T[langue]; }

const params = new URLSearchParams(location.search);
const cle = params.get("k") || "";
const vin = params.get("vin") || "";

function echappe(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function idDrive(url) {
  const m = String(url || "").match(/\/d\/([^/?]+)/) || String(url || "").match(/[?&]id=([^&]+)/);
  return m ? m[1] : "";
}

function vignette(url, largeur) {
  if (!url) return "";
  const id = idDrive(url);
  return id ? "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + largeur : url;
}

function kmLisible(km) {
  const n = parseInt(String(km || "").replace(/[^0-9]/g, ""), 10);
  if (!n) return "";
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, langue === "en" ? "," : " ") + " km";
}

/** Un code du décodeur → libellé dans la langue ; une valeur inconnue passe telle quelle. */
function code(c) {
  if (!c) return "";
  const s = String(c);
  const m = s.match(/^([^:]+):(\d+)$/);        // transmission « automatique:9 »
  if (m) return (t().codes[m[1]] || m[1]) + " · " + t().vitesses(m[2]);
  return t().codes[s] || s;
}

function afficherMessage(titre, detail) {
  document.getElementById("contenu").hidden = true;
  const m = document.getElementById("message");
  m.innerHTML = "<strong>" + echappe(titre) + "</strong>" + echappe(detail || "");
  m.hidden = false;
}

function appliquerTextes() {
  document.documentElement.lang = langue;
  document.getElementById("retour").textContent = t().retour;
  document.getElementById("retour").href = "index.html?k=" + encodeURIComponent(cle);
  document.getElementById("pied").textContent = t().pied(vehicule && vehicule.vendeur ? vehicule.vendeur.nom : "");
  document.getElementById("titreOffre").textContent = t().titreOffre;
  document.getElementById("aideOffre").textContent = t().aideOffre;
  document.querySelector('label[for="nom"]').textContent = t().nom;
  document.querySelector('label[for="entreprise"]').textContent = t().entreprise;
  document.querySelector('label[for="courriel"]').textContent = t().courriel;
  document.querySelector('label[for="telephone"]').textContent = t().telephone;
  document.querySelector('label[for="prix"]').textContent = t().prix;
  document.querySelector('label[for="conditions"]').textContent = t().conditions;
  document.getElementById("envoyer").textContent = t().envoyer;
  document.querySelectorAll(".langues button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.langue === langue));
  });
  if (vehicule) dessiner();
}

/** « 2026 GMC » + « Acadia Elevation » quand le décodeur a parlé, sinon le modèle de l'inventaire. */
function titres(v) {
  if (v.annee && v.marque) {
    return { haut: v.annee + " " + v.marque, annee: v.annee, bas: [v.modele, v.version].filter(Boolean).join(" ") };
  }
  const m = String(v.model || "").trim();
  const an = m.match(/\b(19|20)\d{2}\b/);
  return { haut: m || v.vin, annee: an ? an[0] : "", bas: "" };
}

function dessiner() {
  const v = vehicule;
  const photos = v.photos || [];
  const ti = titres(v);
  // La page est au nom de la concession qui vend (règle du 1er oct.).
  const nomVendeur = (v.vendeur && v.vendeur.nom) || "";
  document.title = (nomVendeur ? nomVendeur + " — " : "") + ti.haut + (ti.bas ? " " + ti.bas : "");
  document.getElementById("pied").textContent = t().pied(nomVendeur);

  // En-tête photo
  const hero = document.getElementById("hero");
  const lieu = v.vendeur ? [v.vendeur.ville, v.vendeur.province].filter(Boolean).join(", ") : "";
  let h = "";
  if (photos.length) {
    if (photoCourante >= photos.length) photoCourante = 0;
    hero.classList.remove("sansPhoto");
    h += '<img id="grande" src="' + echappe(vignette(photos[photoCourante], 1200)) + '" alt="">';
  } else {
    hero.classList.add("sansPhoto");
  }
  h += '<div class="voile"></div>';
  let titreHtml = echappe(ti.haut);
  if (ti.annee && ti.haut.indexOf(ti.annee) === 0) {
    titreHtml = '<span class="annee">' + echappe(ti.annee) + "</span>" + echappe(ti.haut.slice(ti.annee.length));
  }
  h += '<div class="coin hg"><div class="titre">' + titreHtml + "</div>" + (ti.bas ? '<div class="sous">' + echappe(ti.bas) + "</div>" : "") + "</div>";
  if (lieu) h += '<div class="coin hd"><div class="lieu">' + echappe(lieu) + "</div></div>";
  if (v.vendeur && v.vendeur.nom) h += '<div class="coin bg"><div class="vendeurNom">' + echappe(v.vendeur.nom) + "</div></div>";
  h += '<div class="coin bd">' + (kmLisible(v.km) ? '<div class="km">' + echappe(kmLisible(v.km)) + "</div>" : "") + '<div class="vin">' + echappe(v.vin) + "</div></div>";
  if (photos.length > 1) h += '<div class="compteur">' + echappe((photoCourante + 1) + " / " + photos.length) + "</div>";
  if (!photos.length) h += '<div class="compteur">' + echappe(t().sansPhoto) + "</div>";
  hero.innerHTML = h;

  const bande = document.getElementById("bande");
  bande.hidden = photos.length < 2;
  bande.innerHTML = photos.map((p, i) =>
    '<img src="' + echappe(vignette(p, 200)) + '" alt="" data-i="' + i + '"' +
    (i === photoCourante ? ' aria-current="true"' : "") + ">"
  ).join("");
  bande.querySelectorAll("img").forEach(img => {
    img.addEventListener("click", () => { photoCourante = Number(img.dataset.i); dessiner(); });
  });

  // Lignes clés
  let c = '<div class="ligne"><span class="k">' + echappe(t().prixDemande) + '</span><span class="v prix">' +
    echappe(v.price || t().surDemande) + "</span></div>";
  c += '<div class="ligne"><span class="k">' + echappe(t().km) + '</span><span class="v">' + echappe(kmLisible(v.km) || t().kmInconnu) + "</span></div>";
  if (v.couleur) c += '<div class="ligne"><span class="k">' + echappe(t().couleur) + '</span><span class="v">' + echappe(v.couleur) + "</span></div>";
  if (photos.length) c += '<div class="ligne"><span class="k">' + echappe(t().photosN(photos.length)) + "</span><span class=\"v\"></span></div>";
  document.getElementById("blocCles").innerHTML = c;

  // Options
  const options = v.options || [];
  const blocOptions = document.getElementById("blocOptions");
  blocOptions.hidden = options.length === 0;
  document.getElementById("titreOptions").textContent = t().options;
  document.getElementById("options").innerHTML = options.map(o => "<span>" + echappe(code(o)) + "</span>").join("");

  // Détails
  const d = v.details || {};
  const lignes = [
    [t().annee, v.annee], [t().marque, v.marque], [t().modele, v.modele], [t().version, v.version],
    [t().vin, v.vin], [t().km, kmLisible(v.km)], [t().portes, d.portes], [t().places, d.places],
    [t().carrosserie, code(d.carrosserie)], [t().couleurExt, v.couleur], [t().transmission, code(d.transmission)],
    [t().moteur, d.moteur], [t().motricite, code(d.motricite)], [t().carburant, code(d.carburant)]
  ].filter(x => x[1]);
  const blocDetails = document.getElementById("blocDetails");
  blocDetails.hidden = lignes.length <= 2;     // NIV seul : rien à montrer
  document.getElementById("titreDetails").textContent = t().details;
  document.getElementById("details").innerHTML = lignes.map(x =>
    '<div class="ligne"><span class="k">' + echappe(x[0]) + '</span><span class="v">' + echappe(x[1]) + "</span></div>"
  ).join("");
  document.getElementById("noteDetails").textContent = (v.details || options.length) ? t().noteDetails : "";

  // Window sticker : lien officiel (GM, Ford, Stellantis) vérifié côté script,
  // ou PDF déposé par le vendeur sur Drive (aperçu intégré).
  const st = v.sticker && v.sticker.url ? v.sticker : null;
  const blocSticker = document.getElementById("blocSticker");
  if (st) {
    blocSticker.hidden = false;
    document.getElementById("titreSticker").textContent = t().sticker;
    document.getElementById("aideSticker").textContent = t().aideSticker;
    const idSticker = st.source === "drive" ? idDrive(st.url) : "";
    document.getElementById("stickerApercu").innerHTML = idSticker
      ? '<iframe src="https://drive.google.com/file/d/' + echappe(idSticker) + '/preview" loading="lazy" title="Window sticker"></iframe>'
      : "";
    const lien = document.getElementById("stickerLien");
    lien.href = idSticker ? "https://drive.google.com/file/d/" + idSticker + "/view" : st.url;
    lien.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 15h8M8 18h5"/></svg>' +
      "<span>" + echappe(t().ouvrirSticker) + '</span><span class="fleche">&rarr;</span>';
    document.getElementById("noteSticker").textContent = t().sourceSticker(st.nom || "");
  } else {
    blocSticker.hidden = true;
  }

  // Rapport CARFAX (2 oct.) : lien public du compte concessionnaire, déjà
  // validé côté script (vhr.carfax.ca seulement).
  const blocCarfax = document.getElementById("blocCarfax");
  if (v.carfax && /^https:\/\/vhr\.carfax\.ca\//i.test(v.carfax)) {
    blocCarfax.hidden = false;
    document.getElementById("titreCarfax").textContent = t().carfax;
    document.getElementById("aideCarfax").textContent = t().aideCarfax;
    const lc = document.getElementById("carfaxLien");
    lc.href = v.carfax;
    lc.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:#1d4ed8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-5 3 3 5-7"/></svg>' +
      "<span>" + echappe(t().ouvrirCarfax) + '</span><span class="fleche">&rarr;</span>';
  } else {
    blocCarfax.hidden = true;
  }

  // Vidéo (facultative) : hébergée sur Drive, lue dans son lecteur intégré.
  const blocVideo = document.getElementById("blocVideo");
  const idVideo = idDrive(v.video || "");
  if (idVideo) {
    blocVideo.hidden = false;
    document.getElementById("titreVideo").textContent = t().video;
    document.getElementById("videoCadre").innerHTML =
      '<iframe src="https://drive.google.com/file/d/' + echappe(idVideo) + '/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>';
    const lien = document.getElementById("videoLien");
    lien.href = "https://drive.google.com/file/d/" + idVideo + "/view";
    lien.textContent = t().videoOuvrir;
  } else {
    blocVideo.hidden = true;
  }

  // Notes du vendeur
  const blocDescription = document.getElementById("blocDescription");
  blocDescription.hidden = !v.description;
  document.getElementById("titreDescription").textContent = t().descriptionTitre;
  document.getElementById("description").textContent = v.description || "";

  // Vendeur
  const blocVendeur = document.getElementById("blocVendeur");
  if (v.vendeur && v.vendeur.nom) {
    blocVendeur.hidden = false;
    document.getElementById("titreVendeur").textContent = t().vendeurTitre;
    document.getElementById("vendeur").innerHTML = "<strong>" + echappe(v.vendeur.nom) + "</strong>" +
      (v.vendeur.adresse ? "<br>" + echappe(v.vendeur.adresse) : "") +
      (lieu ? "<br>" + echappe(lieu) : "");
  } else {
    blocVendeur.hidden = true;
  }
}

async function charger() {
  if (!cle || !vin) { afficherMessage(t().LIEN_INVALIDE, ""); return; }
  afficherMessage(t().chargement, "");
  try {
    const r = await fetch(SCRIPT_URL + "?vitrineVin=" + encodeURIComponent(vin) +
                          "&k=" + encodeURIComponent(cle));
    const j = await r.json();
    if (!j.ok) { afficherMessage(t()[j.code] || t().RESEAU, ""); return; }
    vehicule = j.vehicle;
    document.getElementById("message").hidden = true;
    document.getElementById("contenu").hidden = false;
    dessiner();
  } catch (e) {
    afficherMessage(t().RESEAU, "");
  }
}

document.getElementById("formulaire").addEventListener("submit", async ev => {
  ev.preventDefault();
  const bouton = document.getElementById("envoyer");
  const erreur = document.getElementById("erreur");
  erreur.hidden = true;
  bouton.disabled = true;
  bouton.textContent = t().envoi;

  const corps = {
    action: "offre",
    k: cle,
    vin: vin,
    name: document.getElementById("nom").value,
    company: document.getElementById("entreprise").value,
    email: document.getElementById("courriel").value,
    phone: document.getElementById("telephone").value,
    price: document.getElementById("prix").value,
    conditions: document.getElementById("conditions").value,
    langue: langue
  };

  try {
    /* text/plain volontairement : un Content-Type application/json déclenche
       une requête préparatoire OPTIONS, à laquelle Apps Script ne répond pas.
       Le script lit e.postData.contents, qui contient bien le JSON. */
    const r = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(corps)
    });
    const j = await r.json();
    if (j.ok) {
      // Depuis les contrats, l'offre a un identifiant : le lien de suivi
      // permet à l'acheteur de répondre à une contre-offre et de signer.
      const suivi = j.id
        ? '<br><a href="offre.html?o=' + encodeURIComponent(j.id) + '" style="color:inherit;font-weight:600">' + echappe(t().merciSuivre) + "</a>"
        : "";
      document.getElementById("blocOffre").innerHTML =
        '<div class="alerte bon"><strong>' + echappe(t().merci) + "</strong><br>" +
        echappe(t().merciDetail) + suivi + "</div>";
      return;
    }
    erreur.textContent = t()[j.code] || t().RESEAU;
    erreur.hidden = false;
  } catch (e) {
    erreur.textContent = t().RESEAU;
    erreur.hidden = false;
  }
  bouton.disabled = false;
  bouton.textContent = t().envoyer;
});

document.querySelectorAll(".langues button").forEach(b => {
  b.addEventListener("click", () => {
    langue = b.dataset.langue;
    try { localStorage.setItem("automaxLangue", langue); } catch (e) {}
    appliquerTextes();
  });
});

appliquerTextes();
charger();
</script>

</html>
